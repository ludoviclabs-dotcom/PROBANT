# Document méthodologique — Échantillonnage en audit
# Référentiel « Audit Normatif 360 ». Le PRINCIPE (ISA 530 / NEP 530) est
# obligatoire ; le choix de méthode et le calibrage relèvent du jugement.
title: "Échantillonnage en audit"
description: >
  Sélection des éléments à tester : facteurs déterminant la taille de
  l'échantillon et méthodes de sélection statistiques et non statistiques. Le
  principe est obligatoire ; le choix de la méthode et le dimensionnement
  relèvent du jugement professionnel.
status: OBLIGATOIRE
sourceIds: [isa-530, nep-530]
content:
  principles:
    - id: isa-530-sampling
      title: Détermination de la taille de l'échantillon
      status: OBLIGATOIRE
      sourceIds: [isa-530, nep-530]
      description: >
        La taille de l'échantillon dépend du niveau de risque d'échantillonnage
        que l'auditeur est prêt à accepter, des caractéristiques de la
        population, du seuil de signification (et de l'anomalie tolérable), du
        risque évalué d'anomalies significatives et du degré d'assurance
        recherché. Une diminution du risque accepté ou du risque évalué accroît
        la taille requise.
  methods:
    - name: Monetary Unit Sampling (sondage en unités monétaires)
      status: RECOMMANDE
      sourceIds: [isa-530, nep-530]
      description: >
        Sélection proportionnelle à la valeur (probabilité proportionnelle à la
        taille) : les éléments de montant élevé ont plus de chances d'être
        retenus. Particulièrement adapté aux tests de surévaluation des soldes
        d'actif tels que créances clients, stocks et immobilisations.
    - name: Sélection aléatoire
      status: RECOMMANDE
      sourceIds: [isa-530, nep-530]
      description: >
        Tirage aléatoire (générateur de nombres aléatoires) donnant à chaque
        élément une probabilité connue d'être sélectionné. Adapté aux
        populations homogènes, pour les tests de contrôles comme pour les tests
        substantifs ; base d'une extrapolation statistique.
    - name: Sélection non statistique au hasard (haphazard)
      status: BONNE_PRATIQUE
      sourceIds: [isa-530, nep-530]
      description: >
        Sélection sans technique structurée mais en s'efforçant d'éviter tout
        biais conscient (ni privilégier ni écarter certains éléments). Ne permet
        pas d'extrapolation statistique ; la démarche et l'absence de biais
        doivent être documentées.
    - name: Sélection ciblée (éléments spécifiques)
      status: BONNE_PRATIQUE
      sourceIds: [isa-530, nep-530]
      description: >
        Sélection raisonnée d'éléments à risque ou à enjeu, hors logique
        d'échantillon représentatif : éléments de montant significatif,
        transactions inhabituelles, soldes créditeurs chez les clients,
        fournisseurs débiteurs, écritures manuelles et opérations avec les
        parties liées. Les conclusions ne s'extrapolent pas au reste de la
        population.
