# Document méthodologique — Matérialité et seuils de signification
# Référentiel « Audit Normatif 360 ». Le PRINCIPE est obligatoire (ISA 320 /
# NEP 320, ISA 450 / NEP 450) ; les POURCENTAGES sont des bonnes pratiques
# méthodologiques et ne sont JAMAIS imposés par les normes.
title: "Matérialité et seuils de signification"
description: >
  Détermination du seuil global de signification, des seuils spécifiques, du
  seuil de signification pour les travaux et du seuil de remontée des anomalies.
  Le principe de fixation et de documentation du jugement est obligatoire ; les
  fourchettes chiffrées sont des pratiques usuelles à adapter au secteur et au
  risque.
status: OBLIGATOIRE
sourceIds: [isa-320, nep-320, isa-450, nep-450]
content:
  principles:
    - id: isa-320-principle
      title: Détermination des seuils de signification
      status: OBLIGATOIRE
      sourceIds: [isa-320, nep-320]
      description: >
        L'auditeur détermine un seuil global de signification pour les états
        financiers pris dans leur ensemble et, le cas échéant, des seuils
        spécifiques pour certains flux d'opérations, soldes de comptes ou
        informations fournies. Le niveau de ces seuils relève du jugement
        professionnel. La norme impose la détermination et la documentation de
        ce jugement, mais ne fixe aucun pourcentage universel.
    - id: isa-450-evaluation
      title: Évaluation des anomalies relevées au cours de l'audit
      status: OBLIGATOIRE
      sourceIds: [isa-450, nep-450]
      description: >
        Les anomalies identifiées (autres que celles manifestement
        insignifiantes) sont cumulées tout au long de la mission, puis évaluées
        individuellement et globalement au regard des seuils de signification.
        Les anomalies non corrigées sont communiquées à la direction et aux
        personnes constituant le gouvernement d'entreprise, et leur incidence
        sur l'opinion est appréciée.
  defaultPractices:
    globalMateriality:
      label: Seuil global de signification
      status: BONNE_PRATIQUE
      sourceIds: [isa-320, nep-320]
      caveat: >
        Ces pourcentages ne sont PAS imposés par l'ISA 320 ni la NEP 320. Il
        s'agit de fourchettes méthodologiques usuelles (cabinets et doctrine)
        servant de point de départ au jugement. Le référentiel choisi et le
        taux retenu doivent être adaptés au secteur d'activité, à la structure
        et au profil de risque de l'entité, puis documentés.
      benchmarks:
        - benchmark: Résultat avant impôt normalisé
          range: 5% à 10%
          applicability: Société rentable, résultat stable et représentatif.
          status: BONNE_PRATIQUE
        - benchmark: Chiffre d'affaires
          range: 0,5% à 1%
          applicability: Entité à faible marge, start-up ou entité en pertes.
          status: BONNE_PRATIQUE
        - benchmark: Total bilan
          range: 1% à 2%
          applicability: Holding, foncière immobilière ou entité patrimoniale.
          status: BONNE_PRATIQUE
        - benchmark: Capitaux propres
          range: 1% à 5%
          applicability: Holding ou entité financière.
          status: BONNE_PRATIQUE
        - benchmark: Charges opérationnelles
          range: 0,5% à 2%
          applicability: Association, fondation ou entité du secteur public.
          status: BONNE_PRATIQUE
    performanceMateriality:
      label: Seuil de signification pour les travaux (performance materiality)
      status: BONNE_PRATIQUE
      range: 60% à 75% du seuil global
      sourceIds: [isa-320, nep-320]
      caveat: >
        Le principe d'un seuil pour les travaux inférieur au seuil global est
        imposé afin de réduire à un niveau approprié le risque que le cumul des
        anomalies non corrigées et non détectées dépasse le seuil global ; le
        pourcentage retenu relève en revanche du jugement. En pratique, on
        retient plutôt 60% lorsque le risque évalué est élevé et jusqu'à 75%
        lorsque le risque est faible.
    clearlyTrivialThreshold:
      label: Seuil de remontée des anomalies (clairement insignifiantes)
      status: BONNE_PRATIQUE
      range: 3% à 5% du seuil global
      sourceIds: [isa-450, nep-450]
      caveat: >
        En deçà de ce seuil, les anomalies sont considérées comme manifestement
        insignifiantes et ne sont pas cumulées. Cette borne opérationnelle n'est
        pas fixée par les ISA/NEP : elle est déterminée par jugement et doit
        être documentée.
