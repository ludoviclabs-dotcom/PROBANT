# Normes d'exercice professionnel (NEP) — métadonnées structurées.
#
# CE FICHIER NE CONTIENT PAS LE TEXTE DES NORMES. Il stocke des métadonnées,
# un objectif RÉSUMÉ rédigé par PROBANT, des concepts, des références de
# paragraphes et des correspondances. Reproduire les NEP en masse serait à la
# fois inutile au produit et contestable — le renvoi au texte officiel reste la
# seule référence opposable.
#
# CADRE VÉRIFIÉ le 14/08/2026 :
#   - les NEP sont homologuées par arrêté et codifiées au Code de commerce,
#     partie arrêtés, section « De l'exercice du contrôle légal »
#     (articles A821-62 et suivants) ;
#   - NEP 230 « Documentation de l'audit des comptes » : homologuée par arrêté
#     du 27 juillet 2023 (JO du 4 août 2023), modifiée par arrêté du
#     28 décembre 2023 (JO du 31 décembre 2023), remplaçant la NEP 230
#     homologuée par arrêté du 10 avril 2007 ; adaptation d'ISA 230.
#
# NON VÉRIFIÉ : les intitulés exacts des autres NEP. Le portail CNCC rend sa
# liste par script, non lisible à la consultation ; les intitulés repris
# ci-dessous proviennent du registre interne data/sources/nep.yml, antérieur à
# ce PR. Ils portent donc status: review_required — ce sont des libellés de
# travail, pas des intitulés officiels certifiés.

referentialId: nep-metadata
label: NEP — métadonnées par thème d'audit

entries:
