    title: Principes applicables à l'audit des comptes
    themes: [planification, documentation]
    objectiveSummary: >
      Fixe les principes généraux et les objectifs de l'audit légal, et le
      cadre dans lequel s'inscrivent les autres normes.
    concepts: [assurance raisonnable, esprit critique, jugement professionnel]
    paragraphReferences: []
    relatedCycles: []
    isaCrosswalk: [isa-200]
    status: review_required
    sources:
      - sourceId: nep-cncc-master
        kind: primary
        url: https://www.cncc.fr/les-normes-dexercice-professionnel.html
        note: Intitulé repris du registre interne, non recertifié à la source.

  - id: nep-230
    number: "230"
    title: Documentation de l'audit des comptes
    themes: [documentation]
    objectiveSummary: >
      Définit les principes de constitution du dossier documentant les travaux
      d'audit réalisés pour chaque entité contrôlée.
    concepts: [dossier de travail, piste d'audit, conservation]
    paragraphReferences: []
    relatedCycles: []
    isaCrosswalk: [isa-230]
    status: verified
    sources:
      - sourceId: nep-cncc-master
        kind: primary
        url: https://doc.cncc.fr/docs/nep-230-documentati
        retrievedAt: "2026-08-14"
        paragraphReference: >
          Homologuée par arrêté du 27/07/2023 (JO 04/08/2023), modifiée par
          arrêté du 28/12/2023 (JO 31/12/2023).
      - sourceId: legifrance-code-commerce
        kind: primary
        url: https://www.legifrance.gouv.fr/codes/id/LEGISCTA000048874153/2024-01-01
        retrievedAt: "2026-08-14"
        paragraphReference: Articles A821-62 à A821-98
    note: >
      Seule NEP dont l'intitulé et le régime d'homologation ont été vérifiés
      lors de ce PR. ISA 230 est la norme dont elle constitue l'adaptation.

