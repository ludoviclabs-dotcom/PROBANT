      des ventes 522-1 à 522-12, contrats à long terme 523-1 à 523-7, résultat
      531-1 à 531-5, impôts 541-1 à 542-2) et renumérote notamment le résultat
      exceptionnel en 531-5 et l'impôt sur les bénéfices en 542-1.
