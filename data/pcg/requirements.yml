  - id: anc-2026-04-impot-benefices
    reference: Règlement ANC n° 2026-04 du 4 mai 2026
    title: >
      Modification du PCG — modalités de comptabilisation de l'impôt sur les
      bénéfices et des contributions rattachées (art. 515-1)
    summary: >
      Règlement adopté par le Collège de l'ANC le 6 mai 2026 (titre daté du
      4 mai 2026), homologué par arrêté du 12 août 2026 publié au Journal
      officiel du 3 septembre 2026. L'art. 515-1 est remplacé (impôt
      comptabilisé sur l'exercice au titre duquel l'entreprise en est
      redevable ; taux en vigueur à la date de clôture) et l'art. 515-1-1 est
      abrogé. Le texte ne porte pas d'article d'application : l'annonce
      officielle de l'ANC précise l'entrée en vigueur le lendemain de la
      publication au Journal officiel et l'application aux exercices en cours
      à cette date.
