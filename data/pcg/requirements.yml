# Plan comptable général — version consolidée et amendements datés.
#
# ─── VÉRIFIÉ le 14/08/2026 sur le site de l'ANC ───────────────────────────────
#
# Version consolidée indexée : PCG au 1er janvier 2026 (règlement ANC 2014-03
# modifié), publiée par l'ANC.
# https://www.anc.gouv.fr/files/anc/files/1_Normes_fran%C3%A7aises/Reglements/Recueils/PCG_janvier2026/PCG--1er-janvier-2026.pdf
#
# Règlements 2026 modifiant le règlement ANC 2014-03, relevés sur la page
# officielle des règlements de l'ANC :
#   - ANC 2026-03, adopté le 06/03/2026 — comptabilisation des produits des
#     ventes ;
#   - ANC 2026-04, adopté le 06/05/2026 — modalités de comptabilisation de
#     l'impôt sur les bénéfices et des contributions qui s'y rattachent ;
#     entrée en vigueur le lendemain de la publication au Journal officiel,
#     applicable aux exercices en cours à cette date.
#
# ─── EXPLICITEMENT NON RETENU ────────────────────────────────────────────────
#
# Un résumé de moteur de recherche attribuait au règlement « ANC 2024-07 » une
# ligne obligatoire « autres fonds propres » applicable aux exercices ouverts à
# compter du 01/01/2026. Ce règlement NE FIGURE PAS sur la page officielle des
# règlements de l'ANC consultée le 14/08/2026, qui liste pour 2024 le règlement
# 2024-02 (certificats d'économies d'énergie). L'information n'est donc pas
# reprise ici : elle est consignée en attente de vérification dans
# docs/knowledge/REVIEW_REQUIRED.md. Recopier un résumé de recherche dans un
# référentiel normatif est exactement le risque que ce PR doit écarter.
#
# ─── PORTÉE ──────────────────────────────────────────────────────────────────
#
# Ce fichier indexe des RÈGLEMENTS et leurs dates d'effet. Il ne réécrit pas
# les articles du PCG : les exigences article par article restent à saisir,
# sous revue métier.

