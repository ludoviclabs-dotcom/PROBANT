      les règlements ANC 2022-06 (art. 513-5, résultat exceptionnel) et
      ANC 2024-07 (chapitre I bis « Autres fonds propres ») ; elle ne porte
      ni la renumérotation d'ANC 2026-03 ni la rédaction 2026-04 de
      l'art. 515-1. Édition de lecture pour les exercices ouverts à compter du
      1er janvier 2026 ; un exercice 2024 ou 2025 se lit dans l'édition ou le
