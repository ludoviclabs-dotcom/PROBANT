# Plan comptable général — version consolidée et règlements datés.
#
# ─── VÉRIFIÉ le 14/08/2026 sur le site de l'ANC, CORRIGÉ le 13/10/2026 (Mission C04) ──────────
#
# Version consolidée indexée : PCG au 1er janvier 2026 (règlement ANC 2014-03
# modifié), publiée par l'ANC. Deux fichiers PDF coexistent à deux URL de l'ANC
# pour la même version consolidée (183 pages chacun) : empreintes ci-dessous.
#
# Chaque règlement distingue désormais : adoption par le Collège, homologation
# par arrêté, publication au Journal officiel, première période applicable,
# anticipation admise et champ contractuel lorsqu'il existe. Ces dates sont
# lues dans l'en-tête et l'article d'application des PDF officiels de l'ANC,
# pas dans un résumé. Une version récente n'est jamais appliquée à un exercice
# ouvert avant sa première période applicable : le résolveur partagé
# `lib/knowledge/french-gaap.ts` juge chaque période à sa date d'ouverture.
#
# ─── CORRECTION DU 13/10/2026 : ANC 2024-07 ───────────────────────────────────
#
# La version du 14/08/2026 de ce fichier affirmait que le règlement ANC 2024-07
# « NE FIGURE PAS » sur la page officielle des règlements de l'ANC, et écartait
# l'information. C'était une erreur de méthode : l'absence d'un texte dans une
# consultation ou une recherche ne démontre pas l'absence du texte. La page
# consultée listait alors les règlements homologués ; le règlement 2024-07,
# adopté le 06/12/2024, n'a été homologué que par arrêté du 26/12/2025 (JO du
# 27/12/2025) et figure aujourd'hui sur cette page. Le texte homologué (PDF de
# l'ANC, 13 pages) a été lu le 13/10/2026 : il crée le chapitre I bis « Autres
# fonds propres » (art. 314-1 à 316-1), remplace le tableau du passif de
# l'art. 821-1 (« Total des autres fonds propres (II) ») et s'applique aux
# exercices ouverts à compter du 01/01/2026, avec anticipation possible sur
# l'exercice en cours à sa publication (art. 6). Le PCG consolidé au 01/01/2026
# intègre d'ailleurs ce chapitre I bis. Aucune règle de classement n'est tirée
# ici du texte : seule son existence et son applicabilité sont enregistrées.
#
# ─── RENUMÉROTATION 513-5 / 531-5 ─────────────────────────────────────────────
#
# Le résultat exceptionnel est défini à l'art. 513-5 (créé par ANC 2022-06,
# présent dans le PCG consolidé au 01/01/2026) et à l'art. 531-5 (ANC 2026-03,
# chapitre I du titre V remplacé). Les deux numéros sont exacts pour des
# versions différentes : la numérotation est rattachée à la version applicable,
# sans remplacement global.
#
# ─── PORTÉE ──────────────────────────────────────────────────────────────────
#
# Ce fichier indexe des RÈGLEMENTS et leurs dates d'effet. Il ne réécrit pas
# les articles du PCG : les exigences article par article restent à saisir,
# sous revue métier.

