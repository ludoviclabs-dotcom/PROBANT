# Normes IAS/IFRS prioritaires du produit — MÉTADONNÉES uniquement.
#
# Les normes IFRS sont protégées par le droit d'auteur de l'IFRS Foundation.
# Ce fichier ne stocke aucun extrait de texte : titre, périmètre en une phrase,
# statut, dates, correspondances. Le plafond de citation est vérifié
# mécaniquement (contrôle K-007, MAX_QUOTE_CHARS).
#
# ─── CE QUI A ÉTÉ VÉRIFIÉ le 14/08/2026 ───────────────────────────────────────
#
# Source primaire : EFRAG, « The EU Endorsement Status Report », 17 juillet 2026
# https://www.efrag.org/sites/default/files/media/document/2026-07/EFRAG%20Endorsement%20Status%20Report%2017%20July%202026.pdf
#
# Ce rapport énumère les documents IASB/IFRIC NON ENCORE ADOPTÉS par l'UE. À
# cette date y figurent :
#   - IFRS 20 Regulatory Assets and Regulatory Liabilities (publiée 27/05/2026),
#     date d'effet IASB 01/01/2029 ;
#   - IFRS 19 Subsidiaries without Public Accountability: Disclosures
#     (publiée 09/05/2024), adoption attendue T3/T4 2026, effet IASB 01/01/2027 ;
#   - amendements à IAS 28 (option juste valeur, publiés 26/06/2026) ;
#   - amendements à IAS 21 (conversion en monnaie de présentation
#     hyperinflationniste, publiés 13/11/2025), adoption attendue T4 2026 ;
#   - amendements à IFRS 19 (publiés 21/08/2025).
#
# ─── MÉTHODE D'ATTRIBUTION DU STATUT D'ADOPTION UE ────────────────────────────
#
# `euEndorsement.status: endorsed` n'est PAS affirmé de mémoire. Il repose sur
# une déduction explicitée dans `basis` : la norme est absente de la liste EFRAG
# des documents non adoptés au 17/07/2026. Cette déduction est tracée pour
# pouvoir être contestée. `not_endorsed` est en revanche une lecture DIRECTE de
# cette liste.
#
# ─── CE QUI N'A PAS ÉTÉ VÉRIFIÉ ───────────────────────────────────────────────
#
# Les dates d'entrée en vigueur IASB des normes anciennes : le navigateur
# ifrs.org rend sa liste par script et n'a pas pu être lu. Elles valent `null`
# plutôt qu'une valeur plausible. De même, `pcgDifferences`,
# `dataRequirements` et `disclosureRequirements` restent vides : les remplir
# sans source serait inventer. Cf. docs/knowledge/REVIEW_REQUIRED.md.

