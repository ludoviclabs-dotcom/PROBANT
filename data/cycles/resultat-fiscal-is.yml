keyPoints:
  - Vérifier le passage du résultat comptable au résultat fiscal (réintégrations / déductions) et recalculer l'IS.
  - Établir la preuve d'impôt pour expliquer l'écart entre taux effectif et taux théorique.
  - Apprécier la recouvrabilité des impôts différés actifs et les positions fiscales incertaines.
  - En comptes sociaux PCG, pas d'impôts différés (réservés aux comptes consolidés) ; IAS 12 les impose en IFRS.

