slug: immobilisations-incorporelles
family: ACTIF_IMMOBILISE
title: Immobilisations incorporelles
summary: >
  Cycle relatif à la comptabilisation, l'existence, l'évaluation, l'amortissement
  et la dépréciation des immobilisations incorporelles : frais de développement
  activés, distinction recherche/développement, logiciels, brevets, marques et
  fonds commercial, y compris l'appréciation de la durée d'utilité (déterminée
  ou indéterminée).

pcgAccounts: ["20", "280", "290"]
probantSiloIds: ["immobilisations-incorporelles"]
probantCloisons: ["bilan-actif"]

applicableStandards:
  - id: ias-38
    label: IAS 38 — Immobilisations incorporelles
    type: IAS
    status: OBLIGATOIRE
    note: Applicable aux entités en référentiel IFRS.
  - id: pcg-213-x
    label: PCG art. 212/213 — Immobilisations incorporelles et frais de développement
    type: PCG
    status: OBLIGATOIRE
  - id: ias-36
    label: IAS 36 — Dépréciation d'actifs
    type: IAS
    status: OBLIGATOIRE
    note: Test annuel obligatoire pour les incorporels à durée d'utilité indéterminée.
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-540
    label: ISA 540 (révisée) — Estimations comptables
    type: ISA
    status: OBLIGATOIRE
    note: Pertinent pour la durée d'utilité et la dépréciation.
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-520
    label: ISA 520 — Procédures analytiques
    type: ISA
    status: OBLIGATOIRE

thresholds:
  - label: Activation des frais de développement
    value: Comptabilisation à l'actif uniquement si les six critères d'IAS 38.57 (ou conditions PCG) sont cumulativement remplis
    status: OBLIGATOIRE
    sourceIds: ["ias-38", "pcg-213-x"]
  - label: Frais de recherche
    value: Toujours comptabilisés en charges (jamais d'activation)
    status: OBLIGATOIRE
    sourceIds: ["ias-38"]
  - label: Écart de taux d'amortissement significatif vs N-1
    value: 5 points (paramètre interne PROBANT, à adapter au mandat)
    status: PARAMETRABLE
    sourceIds: ["pcg-213-x"]
    caveat: Seuil indicatif interne, non opposable.

materiality:
  globalMateriality:
    benchmark: Total bilan ou résultat avant impôt normalisé selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt normalisé
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Plutôt 60 % en cas de risque élevé ou
      d'anomalies historiques.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Borne opérationnelle non fixée par les normes.

ratios:
  - name: Poids des incorporels dans le bilan
    formula: Valeur nette des immobilisations incorporelles / Total bilan
    alertThreshold: Ratio élevé ou hausse significative vs N-1 à investiguer
    interpretation: Une part importante d'incorporels peut signaler une activation agressive ou un risque de surévaluation d'actifs.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Taux d'activation de la R&D
    formula: Frais de développement activés de l'exercice / Dépenses de R&D totales de l'exercice
    alertThreshold: Hausse brutale du taux ou ratio anormalement élevé vs secteur à investiguer
    interpretation: Détecte une activation abusive de frais qui auraient dû rester en charges (distinction recherche/développement).
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Taux d'amortissement des incorporels
    formula: Dotations aux amortissements des incorporels / Valeur brute des incorporels amortissables
    alertThreshold: Variation > 5 pts vs N-1 à investiguer
    interpretation: Révèle un changement de durée d'utilité, une erreur de base amortissable ou une dotation anormale.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Analyse de variation des immobilisations incorporelles
    objective: Identifier les activations, sorties et reclassements inhabituels, notamment les frais de développement.
    method: Comparer N/N-1, le budget R&D, le tableau des mouvements et la balance générale.
    expectedVariation: Variation cohérente avec les projets de développement approuvés et le budget R&D.
    anomalyTrigger: Activation importante non rattachée à un projet identifié, sortie non documentée, variation inexpliquée.
    benchmark: ["N-1", "Budget R&D", "Projets de développement"]
    assertions: ["Existence", "Exhaustivité", "Évaluation", "Droits et obligations"]
    sourceIds: ["isa-520", "nep-520"]
  - name: Revue analytique de la durée d'utilité et du taux d'amortissement
    objective: Détecter une durée d'utilité non réaliste ou une rupture de méthode d'amortissement.
    method: Comparer le taux d'amortissement et la durée d'utilité par catégorie d'incorporels N vs N-1 et aux usages sectoriels.
    expectedVariation: Stabilité hors changement justifié et documenté en annexe.
    anomalyTrigger: Durée d'utilité allongée sans justification, incorporels à durée indéterminée non testés annuellement.
    benchmark: ["N-1", "Usages sectoriels"]
    assertions: ["Évaluation", "Rattachement"]
    sourceIds: ["isa-520", "ias-38"]

detailTests:
  - name: Test des frais de développement activés
    nature: Test de détail
    extent: Projets de développement significatifs + échantillon sur le solde restant
    timing: Clôture ou intérim avec roll-forward
    samplingMethod: Sélection ciblée sur les activations importantes + échantillonnage selon ISA 530
    evidenceRequired:
      - Documentation du projet (faisabilité technique et commerciale)
      - Justification du respect des critères d'activation
      - Suivi des coûts engagés (temps, factures)
      - Preuve de la capacité à générer des avantages économiques futurs
    assertions: ["Existence", "Évaluation", "Droits et obligations"]
    sourceIds: ["isa-500", "isa-540"]
  - name: Rapprochement fichier des immobilisations incorporelles / balance générale
    nature: Test substantif
    extent: Rapprochement exhaustif ; ciblé sur les additions significatives
    timing: Clôture
    samplingMethod: Exhaustif sur le rapprochement ; sélection ciblée sur les acquisitions
    evidenceRequired:
      - Fichier des immobilisations incorporelles
      - Balance générale
      - Tableau des mouvements
    assertions: ["Exhaustivité", "Exactitude"]
    sourceIds: ["isa-500", "isa-330"]
  - name: Revue de la dépréciation et de la valeur recouvrable
    nature: Test substantif
    extent: Incorporels à durée indéterminée et incorporels présentant des indices de perte de valeur
    timing: Clôture
    samplingMethod: Sélection ciblée sur les actifs significatifs et les indices de dépréciation
    evidenceRequired:
      - Test de dépréciation (IAS 36)
      - Hypothèses et flux futurs retenus
      - Justification de l'absence d'indices le cas échéant
    assertions: ["Évaluation", "Présentation"]
    sourceIds: ["isa-540", "ias-36"]

risks:
  - name: Activation non justifiée de frais de développement
    category: RISQUE_FRAUDE
    description: Majoration du résultat via l'activation de dépenses de recherche ou de coûts ne remplissant pas les critères d'activation.
    indicators:
      - Hausse inhabituelle des frais de développement activés
      - Baisse artificielle des charges de R&D
      - Projets activés sans documentation de faisabilité
      - Activations concentrées en fin d'exercice
    response:
      - Tester le respect des critères d'activation (IAS 38.57 / PCG)
      - Vérifier la distinction recherche/développement
      - Analyser la nature des coûts activés
    sourceIds: ["isa-240", "isa-315", "ias-38"]
  - name: Durée d'utilité non réaliste
    category: RISQUE_INHERENT
    description: Jugements subjectifs sur la durée d'utilité conduisant à un amortissement insuffisant ou à un classement abusif en durée indéterminée.
    indicators:
      - Durées d'utilité allongées sans justification
      - Incorporels classés à durée indéterminée
      - Logiciels obsolètes maintenus à l'actif
    response:
      - Recalculer les dotations
      - Apprécier le caractère raisonnable des durées d'utilité
      - Vérifier le test annuel des incorporels à durée indéterminée
    sourceIds: ["isa-540", "ias-38"]
  - name: Dépréciation non comptabilisée
    category: RISQUE_CONTROLE
    description: Absence de procédure de revue des indices de perte de valeur et de test de dépréciation des incorporels.
    indicators:
      - Absence de test de dépréciation documenté
      - Fonds commercial ou marques maintenus malgré une perte de rentabilité
      - Indices de perte de valeur non suivis
    response:
      - Tester le processus de revue des indices de dépréciation
      - Rechercher les indices de perte de valeur (IAS 36)
      - Examiner la valeur recouvrable des actifs concernés
    sourceIds: ["isa-315", "isa-330", "ias-36"]

ifrsVsPcg:
  - topic: Critères d'activation des frais de développement
    ifrsTreatment: >
      IAS 38 — activation obligatoire des frais de développement dès que les six
      critères (faisabilité technique, intention et capacité d'achever, avantages
      économiques futurs probables, ressources disponibles, mesure fiable des coûts)
      sont cumulativement remplis ; frais de recherche toujours en charges.
    pcgTreatment: >
      PCG art. 212/213 — les frais de développement peuvent être activés (méthode
      préférentielle) lorsque les conditions sont réunies, mais l'activation reste
      une option et non une obligation ; frais de recherche en charges.
    auditImpact: Vérifier le respect des critères, la cohérence de la méthode retenue (option PCG vs obligation IFRS) et la documentation des projets.
    sourceIds: ["ias-38", "pcg-213-x"]
  - topic: Amortissement des incorporels à durée d'utilité indéterminée
    ifrsTreatment: Pas d'amortissement (IAS 38) mais test de dépréciation annuel obligatoire (IAS 36).
    pcgTreatment: >
      Présomption d'une durée d'utilité ; les incorporels dont la durée n'est pas
      limitée font l'objet d'un test de dépréciation, le PCG encadrant l'amortissement
      des incorporels selon les règles françaises applicables.
    auditImpact: Vérifier le classement de la durée d'utilité et la réalisation effective des tests de dépréciation annuels.
    sourceIds: ["ias-38", "ias-36", "pcg-213-x"]

