keyPoints:
  - Vérifier que seuls les frais de développement remplissant les critères sont activés et que les frais de recherche restent en charges.
  - Apprécier le caractère réaliste de la durée d'utilité, notamment le classement en durée indéterminée.
  - Contrôler la réalisation effective des tests de dépréciation annuels (incorporels à durée indéterminée, fonds commercial).
  - Alerter si le taux d'activation de la R&D augmente brutalement ou si le taux d'amortissement varie de plus de 5 pts vs N-1 sans justification.
  - PROBANT détecte automatiquement les variations anormales d'incorporels (silo immobilisations-incorporelles).

