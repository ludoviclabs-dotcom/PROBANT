slug: provisions-risques-charges
family: PASSIF_ENGAGEMENTS
title: Provisions pour risques et charges
summary: >
  Cycle relatif à l'existence d'une obligation actuelle, à la probabilité de
  sortie de ressources, à l'estimation fiable et à l'actualisation des provisions
  pour risques et charges (litiges, garanties, restructurations).

pcgAccounts: ["15", "6815", "7815"]
probantSiloIds: ["provisions"]
probantCloisons: ["bilan-passif"]

applicableStandards:
  - id: ias-37
    label: IAS 37 — Provisions, passifs et actifs éventuels
    type: IAS
    status: OBLIGATOIRE
  - id: pcg-322-1
    label: PCG art. 322-1 et s. — Provisions pour risques et charges
    type: PCG
    status: OBLIGATOIRE
  - id: isa-540
    label: ISA 540 (révisée) — Estimations comptables
    type: ISA
    status: OBLIGATOIRE
  - id: isa-501
    label: ISA 501 — Éléments probants (litiges)
    type: ISA
    status: OBLIGATOIRE
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-505
    label: ISA 505 — Confirmations externes (avocats)
    type: ISA
    status: OBLIGATOIRE

thresholds:
  - label: Comptabilisation d'une provision
    value: Obligation actuelle + sortie de ressources probable + estimation fiable
    status: OBLIGATOIRE
    sourceIds: ["ias-37", "pcg-322-1"]
  - label: Passif éventuel
    value: Information en annexe si l'obligation est possible mais non probable
    status: OBLIGATOIRE
    sourceIds: ["ias-37"]

materiality:
  globalMateriality:
    benchmark: Résultat avant impôt normalisé ou total bilan
    formula: Méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 5 % à 10 % du résultat avant impôt, ou 1 % à 2 % du total bilan
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel.
  performanceMateriality:
    formula: 60 % à 75 % du seuil global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: Réduire en cas de risque élevé sur les estimations.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Provisions / Chiffre d'affaires
    formula: Total provisions pour risques et charges / Chiffre d'affaires
    alertThreshold: Variation significative vs N-1 à investiguer
    interpretation: Suit le poids des risques provisionnés relativement à l'activité.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Reprises / Dotations
    formula: Reprises de provisions / Dotations aux provisions
    alertThreshold: Reprises élevées récurrentes à investiguer
    interpretation: Des reprises systématiques peuvent révéler un lissage du résultat.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520", "isa-240"]
  - name: Ancienneté des provisions
    formula: Provisions maintenues > 24 mois / Total provisions
    alertThreshold: Provisions anciennes non utilisées à justifier
    interpretation: Détecte d'éventuelles provisions sans objet (réserve occulte).
    status: BONNE_PRATIQUE
    sourceIds: ["isa-540"]

analyticalProcedures:
  - name: Revue des mouvements de provisions
    objective: Apprécier dotations, reprises et provisions sans objet.
    method: Analyser le tableau des mouvements N/N-1 et la justification de chaque ligne.
    expectedVariation: Mouvements cohérents avec les événements de l'exercice.
    anomalyTrigger: Dotation ou reprise importante en clôture, provision ancienne inchangée.
    benchmark: ["N-1"]
    assertions: ["Évaluation", "Exhaustivité"]
    sourceIds: ["isa-520", "isa-540"]

detailTests:
  - name: Confirmation des avocats et conseils
    nature: Confirmation externe
    extent: Ensemble des dossiers contentieux significatifs
    timing: Clôture
    samplingMethod: Sélection ciblée sur les litiges significatifs
    evidenceRequired:
      - Réponses des avocats
      - PV de conseil d'administration
      - Contrats et mises en demeure
    assertions: ["Exhaustivité", "Évaluation"]
    sourceIds: ["isa-501", "isa-505"]
  - name: Recalcul et appréciation des estimations
    nature: Test de détail
    extent: Provisions significatives
    timing: Clôture
    samplingMethod: Sélection ciblée
    evidenceRequired:
      - Bases de calcul
      - Hypothèses retenues
      - Événements postérieurs confirmant l'estimation
    assertions: ["Évaluation"]
    sourceIds: ["isa-540", "isa-560"]

risks:
  - name: Sous-provisionnement / passif non comptabilisé
    category: RISQUE_INHERENT
    description: Obligation probable non provisionnée conduisant à une sous-estimation du passif.
    indicators:
      - Litiges connus non provisionnés
      - Pertes sur contrats en cours
    response:
      - Confirmer les litiges auprès des avocats
      - Rechercher les passifs non enregistrés
    sourceIds: ["ias-37", "isa-501"]
  - name: Lissage du résultat par les provisions
    category: RISQUE_FRAUDE
    description: Constitution/reprise opportuniste de provisions pour piloter le résultat (biais de la direction).
    indicators:
      - Dotations importantes les bons exercices, reprises les mauvais
      - Provisions sans objet maintenues
    response:
      - Analyser l'historique dotations/reprises
      - Tester la justification des provisions anciennes
    sourceIds: ["isa-240", "isa-540"]
  - name: Absence de suivi des engagements
    category: RISQUE_CONTROLE
    description: Défaut de procédure de recensement des litiges et obligations.
    indicators:
      - Pas de revue juridique périodique
    response:
      - Tester le processus de recensement des risques
    sourceIds: ["isa-315"]

ifrsVsPcg:
  - topic: Actualisation des provisions
    ifrsTreatment: Actualisation obligatoire si l'effet temps est significatif (IAS 37).
    pcgTreatment: Actualisation admise mais d'application plus restreinte selon les cas.
    auditImpact: Vérifier le taux d'actualisation et la cohérence de l'échéancier des sorties.
    sourceIds: ["ias-37", "pcg-322-1"]

officialSources:
  - id: ias-37
    label: IAS 37 — Provisions, Contingent Liabilities and Contingent Assets
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-37-provisions-contingent-liabilities-and-contingent-assets.html
    status: OBLIGATOIRE
  - id: pcg-322-1
    label: PCG art. 322-1
    type: PCG
    url: https://www.anc.gouv.fr/fr/reglementation
    status: OBLIGATOIRE
  - id: isa-540
    label: ISA 540 — Auditing Accounting Estimates
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE

keyPoints:
  - Vérifier les trois conditions d'une provision (obligation actuelle, sortie probable, estimation fiable).
  - Circulariser les avocats pour les litiges (ISA 501 / 505).
  - Analyser dotations et reprises pour détecter un éventuel lissage du résultat (ISA 240).
  - Confirmer les estimations par les événements postérieurs à la clôture (ISA 560).

relatedCycles:
  - engagements-hors-bilan
  - estimations-jugements
  - evenements-posterieurs

reviewStatus: EXPERT_VALIDATED
