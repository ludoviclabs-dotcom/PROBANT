keyPoints:
  - Planifier et documenter l'assistance à l'inventaire physique des stocks significatifs (ISA 501).
  - Vérifier la valorisation au plus bas du coût et de la valeur nette de réalisation.
  - Tester le cut-off des dernières réceptions et expéditions autour de la clôture.
  - Alerter si la rotation des stocks varie de plus de 15-20 % vs N-1 ou si un stock dort depuis plus de 12 mois.
  - PROBANT signale automatiquement les stocks dormants et les ruptures de rotation (silo stocks).

