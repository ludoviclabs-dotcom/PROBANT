keyPoints:
  - Rapprocher systématiquement la TVA comptabilisée des déclarations CA3 déposées.
  - Vérifier l'application des taux légaux et la déductibilité de la TVA au regard du CGI.
  - Contrôler le traitement de la TVA sur immobilisations et le cut-off de la TVA.
  - Apprécier la réalité et la recouvrabilité des crédits de TVA anciens.
  - PROBANT signale automatiquement les écarts CA3 / comptabilité et les crédits de TVA anciens (silo dettes-fiscales-sociales).

