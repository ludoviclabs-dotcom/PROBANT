slug: charges-personnel
family: COMPTE_RESULTAT
title: Charges de personnel et masse salariale
summary: >
  Cycle relatif aux charges de personnel : exhaustivité de la paie, charges sociales,
  provisions pour congés payés et primes, avantages du personnel. Vérification du
  rapprochement DSN / paie / comptabilité et de l'absence de salariés fictifs.

pcgAccounts: ["63", "64"]
probantSiloIds: ["charges-personnel"]
probantCloisons: ["resultat"]

applicableStandards:
  - id: ias-19
    label: IAS 19 — Avantages du personnel
    type: IAS
    status: OBLIGATOIRE
    note: Applicable aux entités en référentiel IFRS (provisions, avantages postérieurs à l'emploi).
  - id: pcg
    label: PCG — Charges de personnel (classes 63 et 64)
    type: PCG
    status: OBLIGATOIRE
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-240
    label: ISA 240 — Fraude
    type: ISA
    status: OBLIGATOIRE
    note: Risque de salariés fictifs et de manipulation de la paie.
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-330
    label: ISA 330 — Réponses aux risques évalués
    type: ISA
    status: OBLIGATOIRE
  - id: isa-520
    label: ISA 520 — Procédures analytiques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-540
    label: ISA 540 (révisée) — Estimations comptables
    type: ISA
    status: OBLIGATOIRE
    note: Pertinent pour les provisions congés payés et primes.

thresholds:
  - label: Comptabilisation des provisions pour congés payés et primes
    value: Rattachement à l'exercice des droits acquis par les salariés et non encore réglés
    status: OBLIGATOIRE
    sourceIds: ["pcg"]
  - label: Avantages du personnel (référentiel IFRS)
    value: Évaluation et comptabilisation des avantages du personnel selon IAS 19
    status: OBLIGATOIRE
    sourceIds: ["ias-19"]
  - label: Écart de salaire moyen significatif vs N-1
    value: Seuil d'alerte interne PROBANT, à adapter au mandat
    status: PARAMETRABLE
    sourceIds: ["isa-520"]

materiality:
  globalMateriality:
    benchmark: Résultat avant impôt normalisé ou total des charges d'exploitation
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 5 % à 10 % du résultat avant impôt normalisé, ou 1 % à 2 % du total des charges
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Réduire en cas de risque sur l'exhaustivité de la paie ou les provisions sociales.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Masse salariale / Chiffre d'affaires
    formula: Charges de personnel (classes 63 et 64) / Chiffre d'affaires
    alertThreshold: Variation inexpliquée > 5 %-10 % vs N-1 ou incohérence sectorielle
    interpretation: Détecte une dérive de la masse salariale ou une variation d'effectif non justifiée.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Salaire moyen
    formula: Total des salaires bruts / Effectif moyen (ETP)
    alertThreshold: Variation atypique vs N-1 sans évolution d'effectif ou d'accord salarial
    interpretation: Une hausse anormale peut révéler des salariés fictifs ou des rémunérations indues.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520", "isa-240"]
  - name: Taux de charges sociales
    formula: Charges sociales (classe 645) / Salaires bruts
    alertThreshold: Écart significatif vs taux légaux ou vs N-1
    interpretation: Détecte une erreur de calcul des cotisations ou une assiette incorrecte.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Effectif (ETP) et coût moyen par tête
    formula: Effectif en équivalent temps plein et charges de personnel / ETP
    alertThreshold: Incohérence entre évolution des effectifs et de la masse salariale
    interpretation: Permet de corroborer la masse salariale avec les données RH.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Revue analytique de la masse salariale
    objective: Corroborer la charge de personnel et détecter les variations atypiques.
    method: Comparer la masse salariale N/N-1 au regard de l'évolution des effectifs et des accords salariaux.
    expectedVariation: Variation cohérente avec l'effectif moyen et les revalorisations connues.
    anomalyTrigger: Hausse de masse salariale sans variation d'effectif, salaire moyen incohérent.
    benchmark: ["N-1", "Effectif (ETP)", "Accords salariaux"]
    assertions: ["Exhaustivité", "Exactitude", "Rattachement"]
    sourceIds: ["isa-520"]
  - name: Test de cohérence charges sociales / salaires bruts
    objective: Vérifier la corrélation entre cotisations sociales et base salariale.
    method: Recalculer le taux moyen de charges sociales et le comparer aux taux légaux et à N-1.
    expectedVariation: Taux stable et cohérent avec la réglementation sociale applicable.
    anomalyTrigger: Écart significatif du taux de charges sans changement réglementaire.
    benchmark: ["N-1", "Taux légaux"]
    assertions: ["Exactitude", "Exhaustivité"]
    sourceIds: ["isa-520"]

detailTests:
  - name: Rapprochement DSN / paie / comptabilité
    nature: Test substantif
    extent: Rapprochement global sur l'exercice ; investigation des écarts
    timing: Clôture
    samplingMethod: Exhaustif sur le rapprochement ; sélection ciblée sur les écarts
    evidenceRequired:
      - Déclarations sociales nominatives (DSN)
      - Journal de paie
      - Balance générale (comptes 63 et 64)
      - États de rapprochement
    assertions: ["Exhaustivité", "Exactitude"]
    sourceIds: ["isa-500", "isa-330"]
  - name: Test d'un échantillon de bulletins et de contrats
    nature: Test de détail
    extent: Échantillon de salariés, dont les rémunérations les plus élevées et les nouveaux entrants
    timing: Sur l'exercice
    samplingMethod: Sélection ciblée + échantillonnage selon ISA 530
    evidenceRequired:
      - Contrats de travail
      - Bulletins de paie
      - Justificatifs d'existence du salarié (RH, pointage)
      - Preuves de versement (virements)
    assertions: ["Existence", "Exactitude", "Droits et obligations"]
    sourceIds: ["isa-500", "isa-530", "isa-240"]
  - name: Test des provisions pour congés payés et primes
    nature: Test de détail
    extent: Calcul des provisions CP et primes ; rapprochement avec les états RH
    timing: Clôture
    samplingMethod: Recalcul global + sélection ciblée sur les principales catégories
    evidenceRequired:
      - États des droits à congés payés
      - Accords de primes et bonus
      - Bases de calcul et taux de charges
    assertions: ["Exhaustivité", "Évaluation", "Rattachement"]
    sourceIds: ["isa-540", "isa-500"]

risks:
  - name: Salariés fictifs et manipulation de la paie
    category: RISQUE_FRAUDE
    description: >
      Maintien de salariés fictifs ou d'anciens salariés sur la paie, ou versements de
      rémunérations indues au profit de tiers complices.
    indicators:
      - Salaire moyen incohérent avec l'effectif déclaré
      - Salariés sans contrat, sans pointage ou aux coordonnées bancaires partagées
      - Écarts entre DSN, paie et comptabilité
    response:
      - Rapprocher DSN, paie et comptabilité
      - Tester l'existence de salariés via les pièces RH
      - Examiner les coordonnées bancaires en doublon
    sourceIds: ["isa-240", "isa-330"]
  - name: Insuffisance des provisions congés payés et primes
    category: RISQUE_INHERENT
    description: Sous-évaluation des droits acquis par les salariés (congés payés, primes, bonus) à la clôture.
    indicators:
      - Provision CP stable malgré une hausse de l'effectif
      - Primes versées en N+1 non provisionnées en N
    response:
      - Recalculer les provisions congés payés et primes
      - Rapprocher des droits acquis et des accords en vigueur
    sourceIds: ["isa-540", "isa-500"]
  - name: Erreur de calcul des charges sociales
    category: RISQUE_CONTROLE
    description: Cotisations sociales mal calculées en raison d'une assiette ou d'un taux erroné.
    indicators:
      - Taux de charges sociales hors norme
      - Absence de contrôle de cohérence DSN / comptabilité
    response:
      - Tester les contrôles du processus paie
      - Recalculer un échantillon de cotisations
    sourceIds: ["isa-315", "isa-330"]

ifrsVsPcg:
  - topic: Avantages du personnel
    ifrsTreatment: >
      Comptabilisation de l'ensemble des avantages du personnel selon IAS 19, y compris les
      avantages postérieurs à l'emploi (engagements de retraite) évalués par méthode actuarielle.
    pcgTreatment: >
      Charges de personnel comptabilisées par nature (classes 63 et 64) ; les engagements de
      retraite peuvent être provisionnés ou mentionnés en engagements hors bilan selon l'option retenue.
    auditImpact: >
      Vérifier le périmètre des avantages comptabilisés et, en IFRS, la cohérence des hypothèses
      actuarielles ; en PCG, la cohérence de l'option retenue pour les engagements de retraite.
    sourceIds: ["ias-19", "pcg"]

