keyPoints:
  - Rapprocher systématiquement DSN, journal de paie et comptabilité et investiguer les écarts.
  - Tester l'existence des salariés (contrats, pièces RH) pour écarter le risque de salariés fictifs.
  - Recalculer les provisions pour congés payés et primes au regard des droits acquis.
  - PROBANT corrobore la masse salariale avec les effectifs et détecte les variations atypiques (silo charges-personnel).

