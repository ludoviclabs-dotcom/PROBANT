keyPoints:
  - Recalculer les dotations et vérifier leur cohérence avec le fichier des immobilisations.
  - Examiner toute modification de durée ou de méthode et sa justification en annexe.
  - Apprécier le bien-fondé et le timing des dépréciations et de leurs reprises (risque de pilotage du résultat).
  - PROBANT détecte les ruptures de plan d'amortissement et les variations de dotation atypiques (silo dap).

