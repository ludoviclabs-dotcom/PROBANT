keyPoints:
  - Tester l'exhaustivité des contrats de location à partir des charges de loyers et des contrats de service (risque de contrats omis).
  - Apprécier le caractère raisonnable de la durée de location et du taux d'actualisation (taux d'emprunt marginal).
  - Recalculer la dette de location et le droit d'utilisation et rapprocher des loyers décaissés.
  - Mesurer l'impact du retraitement IFRS 16 sur les ratios et les covenants financiers.
  - Distinguer le traitement IFRS 16 (capitalisation au bilan) du traitement PCG (location simple en charges, crédit-bail en annexe).

