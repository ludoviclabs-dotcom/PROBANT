slug: chiffre-affaires-ifrs15
family: COMPTE_RESULTAT
title: Chiffre d'affaires et reconnaissance du revenu
summary: >
  Cycle relatif à la reconnaissance du chiffre d'affaires : identification des
  obligations de performance, prix de transaction, cut-off, avoirs et contrepartie
  variable. Présomption de risque de fraude sur le revenu (ISA 240).

pcgAccounts: ["70", "71", "72"]
probantSiloIds: ["chiffre-affaires"]
probantCloisons: ["resultat"]

applicableStandards:
  - id: ifrs-15
    label: IFRS 15 — Produits des contrats clients
    type: IFRS
    status: OBLIGATOIRE
  - id: pcg-classe-7
    label: PCG — Comptes de produits (classe 7)
    type: PCG
    status: OBLIGATOIRE
  - id: isa-240
    label: ISA 240 — Fraude (présomption sur le revenu)
    type: ISA
    status: OBLIGATOIRE
  - id: isa-330
    label: ISA 330 — Réponses aux risques évalués
    type: ISA
    status: OBLIGATOIRE
  - id: isa-520
    label: ISA 520 — Procédures analytiques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE

thresholds:
  - label: Reconnaissance du revenu (modèle en 5 étapes)
    value: Transfert du contrôle au client selon les obligations de performance (IFRS 15)
    status: OBLIGATOIRE
    sourceIds: ["ifrs-15"]
  - label: Présomption de fraude sur le revenu
    value: Risque significatif présumé sauf justification contraire documentée
    status: OBLIGATOIRE
    sourceIds: ["isa-240"]

materiality:
  globalMateriality:
    benchmark: Chiffre d'affaires
    formula: Méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 0,5 % à 1 % du chiffre d'affaires
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel.
  performanceMateriality:
    formula: 60 % à 75 % du seuil global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: Réduire en présence d'un risque de fraude au revenu.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Croissance du chiffre d'affaires
    formula: (CA N - CA N-1) / CA N-1
    alertThreshold: Variation atypique vs secteur/budget à investiguer
    interpretation: Une croissance hors tendance peut révéler une reconnaissance prématurée.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Marge brute
    formula: (CA - Coût des ventes) / CA
    alertThreshold: Variation inexpliquée > 5 %-10 % ou incohérence sectorielle
    interpretation: Détecte des ventes fictives ou un cut-off erroné.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Poids du dernier mois
    formula: CA du dernier mois / CA annuel
    alertThreshold: Concentration anormale en fin d'exercice
    interpretation: Indice d'anticipation de ventes (channel stuffing).
    status: BONNE_PRATIQUE
    sourceIds: ["isa-240", "isa-520"]
  - name: Taux d'avoirs
    formula: Avoirs émis / Chiffre d'affaires
    alertThreshold: Avoirs post-clôture significatifs sur ventes N
    interpretation: Avoirs élevés en N+1 = ventes N surévaluées.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Revue analytique du CA par mois / produit / client
    objective: Détecter ruptures de tendance et concentrations atypiques.
    method: Décomposer le CA et comparer N/N-1, budget et saisonnalité.
    expectedVariation: Profil cohérent avec l'activité et la saisonnalité.
    anomalyTrigger: Pic de fin d'exercice, client nouveau à fort volume, marge incohérente.
    benchmark: ["N-1", "Budget", "Saisonnalité"]
    assertions: ["Rattachement", "Exhaustivité", "Exactitude"]
    sourceIds: ["isa-520", "isa-240"]

detailTests:
  - name: Test de cut-off des ventes
    nature: Test de détail
    extent: Transactions autour de la clôture (avant/après)
    timing: Clôture et post-clôture
    samplingMethod: Sélection ciblée sur les dernières et premières factures
    evidenceRequired:
      - Bons de livraison
      - Factures
      - Dates de transfert de contrôle
      - Avoirs post-clôture
    assertions: ["Rattachement"]
    sourceIds: ["isa-240", "isa-500", "ifrs-15"]
  - name: Test des écritures de revenu inhabituelles
    nature: Test de détail (data analytics)
    extent: Écritures manuelles sur comptes 70x, contreparties atypiques
    timing: Sur l'exercice
    samplingMethod: Sélection ciblée fondée sur des critères de risque
    evidenceRequired:
      - Pièces justificatives des écritures manuelles
      - Contrats clients
    assertions: ["Occurrence", "Exactitude"]
    sourceIds: ["isa-240", "isa-330"]

risks:
  - name: Reconnaissance prématurée ou fictive du revenu
    category: RISQUE_FRAUDE
    description: Présomption ISA 240 — anticipation ou création de ventes pour atteindre des objectifs.
    indicators:
      - Pic de CA en fin d'exercice
      - Avoirs massifs en début d'exercice suivant
      - Écritures manuelles de revenu
    response:
      - Tester le cut-off
      - Analyser les avoirs post-clôture
      - Examiner les écritures de revenu manuelles
    sourceIds: ["isa-240", "ifrs-15", "isa-330"]
  - name: Erreur d'évaluation du prix de transaction
    category: RISQUE_INHERENT
    description: Contrepartie variable, remises, obligations multiples mal allouées (IFRS 15).
    indicators:
      - Contrats complexes à éléments multiples
      - Remises de fin d'année
    response:
      - Analyser les contrats significatifs
      - Recalculer l'allocation du prix
    sourceIds: ["ifrs-15", "isa-540"]
  - name: Contournement des contrôles sur la facturation
    category: RISQUE_CONTROLE
    description: Possibilité d'enregistrer des ventes sans pièce ou hors circuit de validation.
    indicators:
      - Séparation des tâches insuffisante
    response:
      - Walkthrough du processus ventes
      - Tests de contrôles sur la facturation
    sourceIds: ["isa-315", "isa-330"]

ifrsVsPcg:
  - topic: Cadre de reconnaissance du revenu
    ifrsTreatment: Modèle unique en 5 étapes fondé sur le transfert de contrôle (IFRS 15).
    pcgTreatment: Reconnaissance au transfert des risques et avantages / achèvement, selon la nature de l'opération.
    auditImpact: Vérifier le fait générateur retenu et la cohérence du cut-off avec le référentiel applicable.
    sourceIds: ["ifrs-15", "pcg-classe-7"]

officialSources:
  - id: ifrs-15
    label: IFRS 15 — Revenue from Contracts with Customers
    type: IFRS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers.html
    status: OBLIGATOIRE
  - id: isa-240
    label: ISA 240 — Fraud
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
  - id: pcg-classe-7
    label: PCG — Produits (classe 7)
    type: PCG
    url: https://www.anc.gouv.fr/fr/reglementation
    status: OBLIGATOIRE

keyPoints:
  - Traiter le revenu comme un risque de fraude présumé (ISA 240) sauf réfutation documentée.
  - Tester le cut-off (BL, factures, dates de transfert de contrôle) et les avoirs post-clôture.
  - Analyser les écritures de revenu manuelles et inhabituelles.
  - PROBANT détecte les ventes antidatées et les anomalies de rattachement (silo chiffre-affaires).

relatedCycles:
  - creances-clients
  - cutoff-separation-exercices
  - controle-interne-fraude

reviewStatus: REVIEW_REQUIRED
