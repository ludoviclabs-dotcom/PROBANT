    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-32-financial-instruments-presentation.html
    status: OBLIGATOIRE
  - id: pcg
    label: PCG — Valeurs mobilières de placement (50) et dépréciations (59)
    type: PCG
    url: https://www.anc.gouv.fr/fr/reglementation
    status: OBLIGATOIRE

keyPoints:
  - Confirmer l'existence des titres auprès des dépositaires (ISA 505).
  - Recalculer la valeur de marché à partir de sources indépendantes et apprécier les dépréciations.
  - En PCG, vérifier la non-comptabilisation des plus-values latentes et la suffisance des dépréciations.
  - En IFRS, vérifier la classification et l'évaluation à la juste valeur (IFRS 9).
  - PROBANT signale automatiquement les moins-values latentes non dépréciées et les concentrations (silo autres-creances-tresorerie).

