slug: vmp
family: TRESORERIE
title: Valeurs mobilières de placement
summary: >
  Cycle relatif à l'existence, la classification, l'évaluation (juste valeur ou
  coût historique), la liquidité et la dépréciation des valeurs mobilières de
  placement (titres détenus à des fins de gestion de trésorerie).

pcgAccounts: ["50", "59"]
probantSiloIds: ["autres-creances-tresorerie"]
probantCloisons: ["bilan-actif"]

applicableStandards:
  - id: ifrs-9
    label: IFRS 9 — Instruments financiers
    type: IFRS
    status: OBLIGATOIRE
    note: Classification et évaluation à la juste valeur en référentiel IFRS.
  - id: ias-32
    label: IAS 32 — Instruments financiers (présentation)
    type: IAS
    status: OBLIGATOIRE
  - id: pcg
    label: PCG — Valeurs mobilières de placement (50) et dépréciations (59)
    type: PCG
    status: OBLIGATOIRE
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-540
    label: ISA 540 (révisée) — Estimations comptables
    type: ISA
    status: OBLIGATOIRE
    note: Pertinent pour l'évaluation de la juste valeur et des dépréciations.
  - id: isa-505
    label: ISA 505 — Confirmations externes
    type: ISA
    status: OBLIGATOIRE
    note: Confirmation des titres auprès des dépositaires.

thresholds:
  - label: Évaluation des VMP en référentiel PCG
    value: Coût historique avec dépréciation si la valeur d'inventaire est inférieure au coût
    status: OBLIGATOIRE
    sourceIds: ["pcg"]
  - label: Classification et évaluation en référentiel IFRS
    value: Classement et évaluation à la juste valeur selon le modèle de gestion (IFRS 9)
    status: OBLIGATOIRE
    sourceIds: ["ifrs-9", "ias-32"]
  - label: Concentration par contrepartie
    value: Concentration significative sur une seule contrepartie à investiguer (paramètre interne PROBANT)
    status: PARAMETRABLE
    sourceIds: ["isa-520"]
    caveat: Seuil indicatif interne, non opposable.

materiality:
  globalMateriality:
    benchmark: Total bilan ou résultat avant impôt normalisé selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt normalisé
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Plutôt 60 % en cas d'instruments complexes ou de pertes latentes significatives.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: VMP / trésorerie totale
    formula: Valeurs mobilières de placement / (Disponibilités + VMP)
    alertThreshold: Part élevée et volatile vs N-1 à investiguer
    interpretation: >
      Une part importante de VMP dans la trésorerie expose à un risque de valeur et
      de liquidité supérieur à celui des disponibilités.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Plus-values latentes
    formula: (Valeur de marché - Coût d'acquisition) / Coût d'acquisition
    alertThreshold: Moins-values latentes significatives non dépréciées à investiguer
    interpretation: >
      Des moins-values latentes non provisionnées en référentiel PCG signalent une
      dépréciation insuffisante.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Concentration par contrepartie
    formula: Valeur des titres d'une contrepartie / Total des VMP
    alertThreshold: Concentration significative sur une contrepartie à investiguer
    interpretation: >
      Une forte concentration accroît le risque de contrepartie et de perte en cas
      de défaillance de l'émetteur.
    status: PARAMETRABLE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Analyse de la composition et de la valorisation du portefeuille
    objective: Identifier les variations inhabituelles et les écarts entre coût et valeur de marché.
    method: Comparer la valeur comptable et la valeur de marché par ligne de titres N/N-1.
    expectedVariation: Évolution cohérente avec les marchés et les arbitrages de la période.
    anomalyTrigger: Moins-value latente non dépréciée ou ligne sans cotation disponible.
    benchmark: ["N-1", "Cotations de marché"]
    assertions: ["Évaluation", "Existence"]
    sourceIds: ["isa-520", "nep-520"]
  - name: Revue des plus et moins-values latentes
    objective: Détecter une dépréciation insuffisante ou des pertes latentes non enregistrées.
    method: Recalculer les écarts entre coût et valeur d'inventaire et apprécier les dépréciations.
    expectedVariation: Dépréciation constatée lorsque la valeur d'inventaire est inférieure au coût.
    anomalyTrigger: Moins-value latente significative sans dépréciation en référentiel PCG.
    benchmark: ["Cotations de marché", "N-1"]
    assertions: ["Évaluation"]
    sourceIds: ["isa-520", "isa-540"]

detailTests:
  - name: Confirmation des titres auprès des dépositaires
    nature: Confirmation externe
    extent: Lignes significatives du portefeuille
    timing: Clôture
    samplingMethod: Sélection ciblée sur les lignes à forte valeur
    evidenceRequired:
      - Relevés des dépositaires
      - Confirmations externes (ISA 505)
      - État du portefeuille de l'entité
    assertions: ["Existence", "Droits et obligations"]
    sourceIds: ["isa-505", "isa-500"]
  - name: Évaluation à la valeur de marché
    nature: Test substantif
    extent: Lignes significatives + lignes sans cotation directe
    timing: Clôture
    samplingMethod: Sélection ciblée sur les positions significatives ou complexes
    evidenceRequired:
      - Cotations de clôture
      - Sources de marché indépendantes
      - Calcul de la juste valeur ou de la valeur d'inventaire
    assertions: ["Évaluation"]
    sourceIds: ["isa-540", "isa-500", "ifrs-9"]
  - name: Rapprochement titres / comptabilité
    nature: Rapprochement
    extent: Rapprochement exhaustif du portefeuille et de la balance générale
    timing: Clôture
    samplingMethod: Exhaustif sur le rapprochement ; sondage sur les mouvements
    evidenceRequired:
      - État détaillé du portefeuille
      - Balance générale (comptes 50 et 59)
      - Avis d'opéré (achats et ventes de la période)
    assertions: ["Exhaustivité", "Exactitude"]
    sourceIds: ["isa-500", "isa-330"]

risks:
  - name: Mauvaise valorisation des titres
    category: RISQUE_INHERENT
    description: >
      Évaluation erronée du portefeuille faute de cotation fiable ou d'application
      correcte de la méthode d'évaluation retenue.
    indicators:
      - Titres sans cotation active
      - Écart entre valeur comptable et valeur de marché
      - Sources de valorisation non indépendantes
    response:
      - Recalculer la valeur de marché à partir de sources indépendantes
      - Apprécier la méthode d'évaluation appliquée
      - Tester les dépréciations constatées
    sourceIds: ["isa-540", "ifrs-9", "isa-500"]
  - name: Instruments complexes mal compris
    category: RISQUE_INHERENT
    description: >
      Présence d'instruments structurés ou complexes dont la nature et le mode
      d'évaluation sont difficiles à appréhender.
    indicators:
      - Produits structurés ou dérivés incorporés
      - Absence de documentation sur les caractéristiques des titres
      - Modèle d'évaluation interne non vérifié
    response:
      - Documenter les caractéristiques de chaque instrument
      - Recourir si besoin à un expert (ISA 540)
      - Vérifier la classification et le modèle d'évaluation
    sourceIds: ["isa-540", "ias-32", "ifrs-9"]
  - name: Pertes latentes non enregistrées
    category: RISQUE_CONTROLE
    description: >
      Défaut de constatation d'une dépréciation alors que la valeur d'inventaire
      est durablement inférieure au coût d'acquisition.
    indicators:
      - Moins-values latentes significatives
      - Absence de revue périodique des dépréciations
      - Cours durablement inférieur au coût
    response:
      - Recalculer les moins-values latentes par ligne
      - Vérifier la procédure de revue des dépréciations
      - Apprécier la suffisance des dépréciations comptabilisées
    sourceIds: ["isa-315", "isa-330", "isa-540"]

ifrsVsPcg:
  - topic: Évaluation des valeurs mobilières de placement
    ifrsTreatment: >
      IFRS 9 impose l'évaluation à la juste valeur (par résultat ou par capitaux
      propres / OCI selon le modèle de gestion et les caractéristiques des flux),
      les plus et moins-values latentes étant comptabilisées.
    pcgTreatment: >
      Le PCG retient le coût historique ; une dépréciation est constatée lorsque la
      valeur d'inventaire est inférieure au coût, mais les plus-values latentes ne
      sont pas comptabilisées (principe de prudence).
    auditImpact: >
      Divergence majeure d'évaluation : vérifier le modèle de juste valeur en IFRS et,
      en PCG, la non-comptabilisation des plus-values latentes ainsi que la suffisance
      des dépréciations.
    sourceIds: ["ifrs-9", "ias-32", "pcg"]

