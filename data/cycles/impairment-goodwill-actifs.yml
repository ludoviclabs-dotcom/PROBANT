keyPoints:
  - Apprécier le caractère raisonnable des hypothèses clés (flux, WACC, croissance terminale) au regard des références externes (ISA 540).
  - Vérifier la définition et l'affectation des UGT et du goodwill, et la réalisation effective du test annuel.
  - Réaliser des analyses de sensibilité et identifier les UGT à headroom faible.
  - Comparer l'historique budget/réel pour détecter un biais optimiste de la direction.
  - Recourir à un expert de l'auditeur (ISA 620) lorsque la complexité du modèle DCF le justifie.

