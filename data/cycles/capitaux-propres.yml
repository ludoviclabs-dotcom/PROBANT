keyPoints:
  - Rapprocher systématiquement les mouvements de capitaux propres avec les PV d'assemblée générale.
  - Recalculer la dotation à la réserve légale (5 % du bénéfice jusqu'à 10 % du capital).
  - Vérifier les sommes distribuables avant toute distribution de dividendes.
  - Alerter si les capitaux propres deviennent inférieurs à la moitié du capital social (obligation légale + risque continuité).
  - PROBANT suit les mouvements de capitaux propres et signale les ruptures d'affectation (silo capitaux-propres).

