keyPoints:
  - Rapprocher systématiquement les mouvements de capitaux propres avec les PV d'assemblée générale.
  - Rapprocher l'affectation à la réserve légale du repère de l'art. L232-10 (un vingtième au moins du bénéfice de l'exercice diminué des pertes antérieures, jusqu'à ce que la réserve atteigne le dixième du capital).
  - Vérifier les sommes distribuables avant toute distribution de dividendes.
  - Signaler « à examiner » des capitaux propres inférieurs à la moitié du capital social (art. L223-42, L225-248 ; SAS par L227-1) et apprécier la continuité d'exploitation ; ni alerte de dissolution ni délai calculé.
  - PROBANT suit les mouvements de capitaux propres et signale les ruptures d'affectation (silo capitaux-propres).

