slug: capitaux-propres
family: CAPITAUX_PROPRES_FINANCEMENT
title: Capital, réserves et résultat
summary: >
  Cycle relatif aux capitaux propres : capital social, primes, réserves (dont la
  réserve légale), report à nouveau et résultat de l'exercice. Couvre l'affectation
  du résultat, la distribution de dividendes, les mouvements de capital et la
  surveillance des capitaux propres devenus inférieurs à la moitié du capital social.

pcgAccounts: ["10", "11", "12", "13"]
probantSiloIds: ["capitaux-propres"]
probantCloisons: ["bilan-passif"]

applicableStandards:
  - id: pcg
    label: PCG — Comptes de capitaux (classe 1)
    type: PCG
    status: OBLIGATOIRE
  - id: cc-capitaux-propres
    label: Code de commerce — Capitaux propres et capital social
    type: CODE_COMMERCE
    status: OBLIGATOIRE
    note: Réserve légale, affectation du résultat, capitaux propres < moitié du capital.
  - id: ias-1
    label: IAS 1 — Présentation des états financiers
    type: IAS
    status: OBLIGATOIRE
    note: Applicable aux entités en référentiel IFRS ; présentation des capitaux propres et de l'OCI.
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: legifrance-code-commerce
    label: Code de commerce — Dispositions sociétés commerciales
    type: CODE_COMMERCE
    status: OBLIGATOIRE

thresholds:
  - label: Capitaux propres inférieurs à la moitié du capital social
    value: >
      Obligation légale de consultation de l'assemblée (art. L.225-248 et L.223-42
      C. com.) lorsque les capitaux propres deviennent inférieurs à la moitié du capital social
    status: OBLIGATOIRE
    sourceIds: ["cc-capitaux-propres", "legifrance-code-commerce"]
  - label: Dotation à la réserve légale
    value: >
      5 % du bénéfice net de l'exercice, dotation obligatoire jusqu'à 10 % du capital social
    status: OBLIGATOIRE
    sourceIds: ["cc-capitaux-propres", "legifrance-code-commerce"]
  - label: Écart d'affectation du résultat vs décision d'AG
    value: Tout écart entre l'affectation comptabilisée et la décision d'assemblée (paramètre interne PROBANT)
    status: PARAMETRABLE
    sourceIds: ["pcg"]
    caveat: Seuil indicatif interne, non opposable ; tout écart doit être investigué.

materiality:
  globalMateriality:
    benchmark: Total bilan ou résultat avant impôt normalisé selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt normalisé
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Plutôt 60 % en cas de risque élevé ou d'anomalies historiques.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Capitaux propres / Total bilan
    formula: Total des capitaux propres / Total du bilan
    alertThreshold: Ratio faible ou en forte baisse à investiguer
    interpretation: Mesure l'autonomie financière et la solidité de la structure du passif.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Pertes cumulées / Capital social
    formula: (Report à nouveau débiteur + résultat déficitaire) / Capital social
    alertThreshold: Capitaux propres < moitié du capital social (alerte légale)
    interpretation: Détecte le franchissement du seuil légal et un risque sur la continuité d'exploitation.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520", "cc-capitaux-propres"]
  - name: Taux de distribution (pay-out)
    formula: Dividendes distribués / Résultat distribuable
    alertThreshold: Distribution supérieure au résultat distribuable ou aux sommes distribuables
    interpretation: Identifie une distribution irrégulière ou un prélèvement sur des réserves non distribuables.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Analyse de variation des capitaux propres
    objective: Identifier tous les mouvements de capitaux propres et leur justification.
    method: Comparer N/N-1 le tableau de variation des capitaux propres avec les PV d'AG et la balance générale.
    expectedVariation: Variation égale au résultat de l'exercice et aux mouvements décidés en assemblée.
    anomalyTrigger: Mouvement non rattaché à une décision d'AG, distribution non documentée, écart inexpliqué.
    benchmark: ["N-1", "PV d'assemblée générale"]
    assertions: ["Exhaustivité", "Exactitude", "Présentation"]
    sourceIds: ["isa-520", "nep-520"]
  - name: Contrôle de cohérence de l'affectation du résultat
    objective: Vérifier que l'affectation du résultat N-1 respecte la décision d'AG et les contraintes légales.
    method: Rapprocher le résultat N-1, la décision d'affectation, la dotation à la réserve légale et le report à nouveau.
    expectedVariation: Affectation conforme à la résolution votée et à l'obligation de réserve légale.
    anomalyTrigger: Réserve légale non dotée alors qu'exigible, affectation divergente de la résolution.
    benchmark: ["N-1", "PV d'assemblée générale"]
    assertions: ["Exactitude", "Rattachement", "Présentation"]
    sourceIds: ["isa-520", "cc-capitaux-propres"]

detailTests:
  - name: Examen des procès-verbaux d'assemblée générale
    nature: Inspection
    extent: Exhaustif sur les AG et conseils de l'exercice
    timing: Clôture
    samplingMethod: Exhaustif
    evidenceRequired:
      - PV d'assemblée générale ordinaire et extraordinaire
      - PV de conseil d'administration ou de gérance
      - Statuts à jour
    assertions: ["Exhaustivité", "Droits et obligations", "Présentation"]
    sourceIds: ["isa-500", "legifrance-code-commerce"]
  - name: Test des mouvements de capital
    nature: Test de détail
    extent: Exhaustif sur les opérations de capital de l'exercice
    timing: Clôture
    samplingMethod: Exhaustif sur les augmentations, réductions et amortissements de capital
    evidenceRequired:
      - Statuts modifiés
      - Registre des mouvements de titres
      - PV d'AG extraordinaire
      - Justificatifs de libération des apports
    assertions: ["Existence", "Exhaustivité", "Exactitude", "Droits et obligations"]
    sourceIds: ["isa-500", "cc-capitaux-propres"]
  - name: Contrôle de l'affectation du résultat et de la réserve légale
    nature: Test substantif
    extent: Exhaustif sur l'affectation du résultat N-1
    timing: Clôture
    samplingMethod: Exhaustif
    evidenceRequired:
      - PV d'AG d'affectation du résultat
      - Calcul de la dotation à la réserve légale
      - Tableau des sommes distribuables
    assertions: ["Exactitude", "Évaluation", "Présentation", "Rattachement"]
    sourceIds: ["isa-500", "cc-capitaux-propres"]
  - name: Vérification de la distribution de dividendes
    nature: Test de détail
    extent: Exhaustif sur les distributions décidées
    timing: Clôture
    samplingMethod: Exhaustif
    evidenceRequired:
      - Résolution de distribution
      - Tableau des sommes distribuables
      - Justificatifs de paiement des dividendes
    assertions: ["Existence", "Exactitude", "Droits et obligations"]
    sourceIds: ["isa-500", "legifrance-code-commerce"]

risks:
  - name: Distribution irrégulière de dividendes
    category: RISQUE_CONTROLE
    description: >
      Distribution de dividendes supérieure aux sommes distribuables ou prélevée sur des
      réserves non distribuables, en violation des règles du Code de commerce.
    indicators:
      - Distribution excédant le résultat distribuable
      - Réserve légale non encore dotée à 10 % du capital
      - Distribution prélevée sur la prime d'émission ou des réserves indisponibles
    response:
      - Recalculer les sommes distribuables avant distribution
      - Rapprocher la distribution de la résolution d'AG
      - Vérifier le respect des réserves non distribuables
    sourceIds: ["isa-315", "isa-330", "cc-capitaux-propres"]
  - name: Capitaux propres inférieurs aux seuils légaux menaçant la continuité
    category: RISQUE_INHERENT
    description: >
      Capitaux propres devenus inférieurs à la moitié du capital social, déclenchant une
      obligation légale et faisant peser un doute sur la continuité d'exploitation.
    indicators:
      - Pertes cumulées importantes
      - Capitaux propres < moitié du capital social
      - Absence de régularisation dans les délais légaux
    response:
      - Vérifier la consultation de l'assemblée dans les délais
      - Apprécier l'incidence sur la continuité d'exploitation
      - Recouper avec l'appréciation au titre de la continuité (ISA 570)
    sourceIds: ["isa-315", "isa-570", "cc-capitaux-propres"]
  - name: Erreurs d'affectation du résultat
    category: RISQUE_CONTROLE
    description: >
      Affectation du résultat non conforme à la décision d'assemblée ou aux contraintes
      légales (réserve légale, report à nouveau, réserves statutaires).
    indicators:
      - Écart entre l'affectation comptabilisée et la résolution votée
      - Réserve légale non dotée alors qu'exigible
      - Report à nouveau incohérent avec l'historique
    response:
      - Rapprocher l'affectation comptable de la décision d'AG
      - Recalculer la dotation à la réserve légale
      - Vérifier la continuité du report à nouveau N-1 / N
    sourceIds: ["isa-315", "isa-330"]

ifrsVsPcg:
  - topic: Présentation des autres éléments du résultat global (OCI)
    ifrsTreatment: >
      IAS 1 impose un état du résultat global présentant les autres éléments du résultat
      global (OCI) — réévaluations, écarts actuariels, écarts de conversion — distincts du résultat net.
    pcgTreatment: >
      Le PCG ne prévoit pas de notion d'OCI ; ces éléments sont enregistrés directement en
      capitaux propres ou en résultat selon les règles françaises, sans état du résultat global.
    auditImpact: Vérifier la ventilation des éléments en OCI vs résultat et la cohérence du tableau de variation des capitaux propres.
    sourceIds: ["ias-1", "pcg"]
  - topic: Tableau de variation des capitaux propres
    ifrsTreatment: État de variation des capitaux propres obligatoire et normé par IAS 1.
    pcgTreatment: Information sur les capitaux propres fournie en annexe selon les règles du PCG, sans format imposé identique.
    auditImpact: Contrôler l'exhaustivité des mouvements et le rapprochement avec les décisions d'AG.
    sourceIds: ["ias-1", "pcg"]

