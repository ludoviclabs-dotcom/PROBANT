slug: consolidation-perimetre
family: TRANSVERSAL
title: Consolidation et périmètre
summary: >
  Cycle transversal relatif à la détermination du périmètre de consolidation :
  appréciation du contrôle et de l'influence notable, choix des méthodes
  (intégration globale, mise en équivalence), éliminations intragroupe,
  goodwill, intérêts minoritaires et conversion des devises.

pcgAccounts: []
probantSiloIds: []
probantCloisons: ["annexe"]

applicableStandards:
  - id: ifrs-10
    label: IFRS 10 — États financiers consolidés (contrôle)
    type: IFRS
    status: OBLIGATOIRE
  - id: ias-27
    label: IAS 27 — États financiers individuels
    type: IAS
    status: OBLIGATOIRE
  - id: ias-28
    label: IAS 28 — Participations dans des entreprises associées (influence notable)
    type: IAS
    status: OBLIGATOIRE
  - id: ifrs-12
    label: IFRS 12 — Informations sur les participations dans d'autres entités
    type: IFRS
    status: OBLIGATOIRE
  - id: eurlex-2013-34
    label: Directive comptable 2013/34/UE — Comptes consolidés
    type: EU_DIRECTIVE
    status: OBLIGATOIRE
  - id: legifrance-code-commerce
    label: Code de commerce — Obligation et périmètre de consolidation
    type: CODE_COMMERCE
    status: OBLIGATOIRE
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE

thresholds:
  - label: Contrôle (intégration globale)
    value: >
      Pouvoir, exposition aux rendements variables et capacité d'influer sur ces
      rendements (IFRS 10) : intégration globale
    status: OBLIGATOIRE
    sourceIds: ["ifrs-10"]
  - label: Influence notable (mise en équivalence)
    value: >
      Influence notable présumée à partir de 20 % des droits de vote (IAS 28) :
      mise en équivalence
    status: OBLIGATOIRE
    sourceIds: ["ias-28"]

materiality:
  globalMateriality:
    benchmark: Total bilan consolidé ou résultat consolidé avant impôt
    formula: Méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel.
  performanceMateriality:
    formula: 60 % à 75 % du seuil global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: Réduire en présence d'un périmètre complexe ou de nombreuses entités.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Part des intérêts minoritaires
    formula: Intérêts minoritaires / Capitaux propres consolidés
    alertThreshold: Variation significative vs N-1 ou incohérence avec les pourcentages d'intérêt
    interpretation: Vérifie la cohérence des intérêts minoritaires avec les taux de détention.
    status: BONNE_PRATIQUE
    sourceIds: ["ifrs-10", "isa-520"]
  - name: Goodwill / Capitaux propres consolidés
    formula: Goodwill / Capitaux propres consolidés
    alertThreshold: Poids élevé du goodwill à surveiller (risque de dépréciation)
    interpretation: Un goodwill élevé fragilise les capitaux propres en cas de dépréciation.
    status: BONNE_PRATIQUE
    sourceIds: ["ifrs-3", "isa-520"]

analyticalProcedures:
  - name: Revue de cohérence des agrégats consolidés
    objective: Détecter les anomalies de périmètre, d'élimination ou de conversion.
    method: >
      Rapprocher les capitaux propres consolidés, les intérêts minoritaires et le
      goodwill des pourcentages d'intérêt et des liasses des entités du périmètre.
    expectedVariation: Agrégats cohérents avec le périmètre et les taux de détention.
    anomalyTrigger: Écart de réconciliation, entité absente, conversion incohérente.
    benchmark: ["N-1", "Liasses de consolidation"]
    assertions: ["Exhaustivité", "Exactitude", "Présentation"]
    sourceIds: ["ifrs-10", "isa-520"]

detailTests:
  - name: Vérification du périmètre et des méthodes de consolidation
    nature: Test de détail
    extent: Ensemble des entités du périmètre et participations significatives
    timing: Clôture
    samplingMethod: Revue exhaustive de l'organigramme et des taux de détention
    evidenceRequired:
      - Organigramme juridique du groupe
      - Titres de participation et taux de détention
      - Pactes d'actionnaires et accords de gouvernance
      - Détermination du contrôle ou de l'influence notable
    assertions: ["Exhaustivité", "Droits et obligations", "Présentation"]
    sourceIds: ["ifrs-10", "ias-28", "isa-500"]
  - name: Test des éliminations intragroupe et de la conversion
    nature: Test de détail
    extent: Transactions et soldes intragroupe, entités en devises
    timing: Clôture
    samplingMethod: Sélection ciblée sur les flux intragroupe significatifs
    evidenceRequired:
      - Liasses de consolidation
      - Écritures d'élimination des transactions et résultats internes
      - Tables de conversion des devises et écarts de conversion
    assertions: ["Exactitude", "Exhaustivité", "Évaluation"]
    sourceIds: ["ifrs-10", "isa-500"]

risks:
  - name: Entité omise du périmètre de consolidation
    category: RISQUE_INHERENT
    description: >
      Entité contrôlée ou sous influence notable non incluse dans le périmètre,
      faussant les comptes consolidés (IFRS 10 / IAS 28).
    indicators:
      - Entités ad hoc ou structurées non analysées
      - Participations récentes non intégrées
    response:
      - Rapprocher l'organigramme juridique des entités consolidées
      - Apprécier le contrôle de fait sur les entités structurées
    sourceIds: ["ifrs-10", "ifrs-12"]
  - name: Méthode de consolidation erronée
    category: RISQUE_CONTROLE
    description: >
      Application d'une méthode inadaptée au niveau de contrôle ou d'influence
      (intégration globale vs mise en équivalence).
    indicators:
      - Qualification du contrôle non documentée
      - Pactes d'actionnaires modifiant les droits de vote non pris en compte
    response:
      - Réapprécier le contrôle et l'influence notable au regard des accords
      - Vérifier la cohérence de la méthode appliquée
    sourceIds: ["ifrs-10", "ias-28"]
  - name: Transactions intragroupe non éliminées
    category: RISQUE_FRAUDE
    description: >
      Résultats internes ou transactions intragroupe non éliminés pour gonfler le
      résultat ou les actifs consolidés.
    indicators:
      - Marges internes sur stocks non éliminées
      - Ventes intragroupe de fin d'exercice
    response:
      - Tester l'exhaustivité des écritures d'élimination
      - Analyser les flux intragroupe inhabituels en clôture
    sourceIds: ["ifrs-10", "isa-240"]

ifrsVsPcg:
  - topic: Détermination du périmètre de consolidation
    ifrsTreatment: >
      IFRS 10 retient un modèle unique de contrôle fondé sur le pouvoir et
      l'exposition aux rendements variables (incluant le contrôle de fait).
    pcgTreatment: >
      Règlement ANC relatif aux comptes consolidés : contrôle exclusif, contrôle
      conjoint et influence notable, avec des méthodes françaises spécifiques.
    auditImpact: >
      Vérifier la qualification du contrôle et la méthode de consolidation selon
      le référentiel applicable au groupe.
    sourceIds: ["ifrs-10", "eurlex-2013-34"]

officialSources:
  - id: ifrs-10
    label: IFRS 10 — Consolidated Financial Statements
    type: IFRS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-10-consolidated-financial-statements.html
    status: OBLIGATOIRE
  - id: eurlex-2013-34
    label: Directive 2013/34/UE — Comptes annuels et consolidés
    type: EU_DIRECTIVE
    url: https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:32013L0034
    status: OBLIGATOIRE
  - id: legifrance-code-commerce
    label: Code de commerce — Comptes consolidés
    type: CODE_COMMERCE
    url: https://www.legifrance.gouv.fr/codes/texte_lc/LEGITEXT000005634379/
    status: OBLIGATOIRE

keyPoints:
  - Apprécier le contrôle (IFRS 10) et l'influence notable (IAS 28) pour fixer le périmètre.
  - Rapprocher l'organigramme juridique des entités effectivement consolidées.
  - Tester les éliminations intragroupe et la conversion des entités en devises.
  - Traiter les résultats internes non éliminés comme un risque de fraude potentiel.

relatedCycles:
  - impairment-goodwill-actifs
  - immobilisations-financieres
  - parties-liees
  - capitaux-propres

reviewStatus: REVIEW_REQUIRED
