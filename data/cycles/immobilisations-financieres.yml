keyPoints:
  - Confirmer l'existence et la propriété des titres auprès des dépositaires ou registres (ISA 505).
  - Rapprocher systématiquement la valeur comptable des titres de la quote-part de situation nette des filiales.
  - Vérifier le classement des titres selon l'intention de détention et la cohérence des reclassements.
  - Identifier les opérations avec les parties liées et contrôler les autorisations et l'information en annexe.
  - PROBANT signale les écarts valeur comptable / situation nette des participations (silo immobilisations-financieres).

