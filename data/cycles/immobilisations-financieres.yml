slug: immobilisations-financieres
family: ACTIF_IMMOBILISE
title: Immobilisations financières et titres de participation
summary: >
  Cycle relatif à l'existence, la propriété, le classement, l'évaluation et la
  dépréciation des immobilisations financières : titres de participation, titres
  immobilisés, créances rattachées à des participations, prêts et dépôts, ainsi
  que l'identification des opérations avec les parties liées.

pcgAccounts: ["26", "27", "296", "297"]
probantSiloIds: ["immobilisations-financieres"]
probantCloisons: ["bilan-actif"]

applicableStandards:
  - id: ias-27
    label: IAS 27 — États financiers individuels
    type: IAS
    status: OBLIGATOIRE
    note: Comptabilisation des participations dans les états individuels (IFRS).
  - id: ias-28
    label: IAS 28 — Participations dans des entreprises associées et coentreprises
    type: IAS
    status: OBLIGATOIRE
    note: Mise en équivalence en consolidation IFRS.
  - id: ias-32
    label: IAS 32 — Instruments financiers, présentation
    type: IAS
    status: OBLIGATOIRE
  - id: ifrs-9
    label: IFRS 9 — Instruments financiers
    type: IFRS
    status: OBLIGATOIRE
    note: Classement, évaluation et dépréciation des actifs financiers.
  - id: pcg
    label: PCG — Titres de participation et immobilisations financières
    type: PCG
    status: OBLIGATOIRE
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-540
    label: ISA 540 (révisée) — Estimations comptables
    type: ISA
    status: OBLIGATOIRE
    note: Pertinent pour l'évaluation et la dépréciation des titres.
  - id: isa-505
    label: ISA 505 — Confirmations externes
    type: ISA
    status: OBLIGATOIRE
    note: Confirmation de la détention et de la propriété des titres.

thresholds:
  - label: Dépréciation des titres de participation
    value: Dotation d'une dépréciation dès que la valeur d'utilité (quote-part de situation nette corrigée, rentabilité, perspectives) est inférieure à la valeur comptable
    status: OBLIGATOIRE
    sourceIds: ["pcg", "ias-36"]
  - label: Classement des titres
    value: Distinction titres de participation / titres immobilisés de l'activité de portefeuille / autres titres immobilisés selon l'intention de détention
    status: OBLIGATOIRE
    sourceIds: ["pcg", "ifrs-9"]
  - label: Écart valeur comptable / quote-part de situation nette
    value: Écart significatif à investiguer (paramètre interne PROBANT, à adapter au mandat)
    status: PARAMETRABLE
    sourceIds: ["pcg"]
    caveat: Seuil indicatif interne, non opposable.

materiality:
  globalMateriality:
    benchmark: Total bilan ou résultat avant impôt normalisé selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt normalisé
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Plutôt 60 % en cas de risque élevé ou
      d'anomalies historiques.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Borne opérationnelle non fixée par les normes.

ratios:
  - name: Poids des titres dans les capitaux propres
    formula: Valeur nette des titres de participation / Capitaux propres
    alertThreshold: Ratio élevé concentrant le risque sur quelques participations à investiguer
    interpretation: Mesure l'exposition de l'entité à la valeur de ses filiales et le risque de dépréciation en cas de contre-performance.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Couverture par la quote-part de situation nette
    formula: Quote-part de situation nette de la filiale / Valeur comptable des titres
    alertThreshold: Ratio inférieur à 1 (situation nette < valeur comptable) à investiguer comme indice de dépréciation
    interpretation: Un ratio inférieur à 1 signale un écart entre coût d'acquisition et actif net, premier indice d'un besoin de dépréciation.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520", "ias-36"]
  - name: Rendement des participations
    formula: Dividendes reçus de la filiale / Résultat net de la filiale
    alertThreshold: Distribution massive vs résultat ou absence de dividende sur filiale rentable à investiguer
    interpretation: Détecte une distribution appauvrissante de la filiale (indice de dépréciation des titres) ou des flux anormaux avec une partie liée.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Analyse de variation des immobilisations financières
    objective: Identifier les acquisitions, cessions, souscriptions et reclassements de titres inhabituels.
    method: Comparer N/N-1, le tableau des mouvements de titres et la balance générale, et rapprocher des décisions des organes sociaux.
    expectedVariation: Variation cohérente avec les opérations de croissance externe et les décisions documentées.
    anomalyTrigger: Acquisition ou cession non documentée, variation inexpliquée, mouvements avec des entités liées.
    benchmark: ["N-1", "PV des organes sociaux", "Tableau des mouvements"]
    assertions: ["Existence", "Exhaustivité", "Évaluation", "Droits et obligations"]
    sourceIds: ["isa-520", "nep-520"]
  - name: Revue analytique des dépréciations de titres
    objective: Apprécier la cohérence des dépréciations avec la performance et la situation nette des filiales.
    method: Comparer la valeur comptable des titres à la quote-part de situation nette et aux perspectives de rentabilité, N vs N-1.
    expectedVariation: Dépréciation alignée sur la dégradation éventuelle de la situation nette ou de la rentabilité.
    anomalyTrigger: Situation nette inférieure à la valeur comptable sans dépréciation, perte récurrente de la filiale non provisionnée.
    benchmark: ["N-1", "Comptes des filiales"]
    assertions: ["Évaluation", "Présentation"]
    sourceIds: ["isa-520", "isa-540"]

detailTests:
  - name: Confirmation externe de la détention des titres
    nature: Confirmation externe
    extent: Titres significatifs détenus auprès de tiers (dépositaires, registres)
    timing: Clôture ou date proche
    samplingMethod: Sélection ciblée sur les lignes significatives
    evidenceRequired:
      - Réponses aux demandes de confirmation
      - Registre des titres / attestation du dépositaire
      - Statuts et titres de propriété
    assertions: ["Existence", "Droits et obligations"]
    sourceIds: ["isa-505", "isa-500"]
  - name: Test d'évaluation et de dépréciation à partir des comptes des filiales
    nature: Test substantif
    extent: Participations significatives et titres présentant des indices de perte de valeur
    timing: Clôture
    samplingMethod: Sélection ciblée sur les participations à forte valeur ou en perte
    evidenceRequired:
      - Comptes annuels des filiales (situation nette)
      - Calcul de la valeur d'utilité
      - Hypothèses de rentabilité et perspectives
      - Justification de la dépréciation ou de son absence
    assertions: ["Évaluation", "Présentation"]
    sourceIds: ["isa-540", "isa-500"]
  - name: Examen des PV d'acquisition et des créances rattachées
    nature: Test de détail
    extent: Acquisitions de l'exercice et créances rattachées significatives
    timing: Clôture ou intérim avec roll-forward
    samplingMethod: Sélection ciblée + échantillonnage selon ISA 530
    evidenceRequired:
      - PV d'acquisition et décisions des organes sociaux
      - Contrats d'acquisition et de prêt
      - Justification du prix d'acquisition
      - Conventions avec les parties liées
    assertions: ["Existence", "Droits et obligations", "Évaluation"]
    sourceIds: ["isa-500", "isa-530"]

risks:
  - name: Non-dépréciation des titres de participation
    category: RISQUE_INHERENT
    description: Maintien des titres à leur coût d'acquisition malgré une dégradation de la situation nette ou de la rentabilité des filiales.
    indicators:
      - Situation nette de la filiale inférieure à la valeur comptable des titres
      - Pertes récurrentes de la filiale
      - Absence de calcul de valeur d'utilité
    response:
      - Rapprocher la valeur comptable de la quote-part de situation nette
      - Apprécier les perspectives de rentabilité
      - Recalculer la valeur d'utilité et la dépréciation nécessaire
    sourceIds: ["isa-540", "ias-36"]
  - name: Mauvaise classification des titres
    category: RISQUE_CONTROLE
    description: Classement erroné entre titres de participation, titres immobilisés et VMP, faussant l'évaluation et la présentation.
    indicators:
      - Absence de documentation de l'intention de détention
      - Reclassements non justifiés entre catégories
      - Titres de placement classés en immobilisations
    response:
      - Examiner l'intention de détention documentée
      - Vérifier la cohérence du classement avec les règles PCG / IFRS 9
      - Contrôler les reclassements de l'exercice
    sourceIds: ["isa-315", "ifrs-9"]
  - name: Parties liées non identifiées
    category: RISQUE_FRAUDE
    description: Opérations sur titres ou créances avec des entités liées non identifiées, non autorisées ou conclues hors conditions normales de marché.
    indicators:
      - Acquisitions/cessions de titres avec des entités du groupe à des prix atypiques
      - Créances rattachées non documentées
      - Absence d'autorisation des conventions réglementées
    response:
      - Identifier les parties liées et les conventions réglementées
      - Examiner les conditions des opérations (prix, contreparties)
      - Vérifier les autorisations et l'information en annexe
    sourceIds: ["isa-240", "isa-550", "cc-conventions-reglementees"]

ifrsVsPcg:
  - topic: Évaluation des titres de participation
    ifrsTreatment: >
      Selon le référentiel : juste valeur (IFRS 9, par résultat ou par OCI) dans
      les états individuels, ou mise en équivalence des entreprises associées
      (IAS 28) en consolidation ; dépréciation selon le modèle applicable.
    pcgTreatment: >
      Comptabilisation au coût historique d'acquisition, dépréciation lorsque la
      valeur d'utilité (quote-part de situation nette corrigée, rentabilité,
      perspectives) est inférieure à la valeur comptable ; pas de réévaluation à
      la juste valeur.
    auditImpact: Vérifier la base d'évaluation retenue, le calcul de la valeur d'utilité ou de la juste valeur et la cohérence des dépréciations.
    sourceIds: ["ifrs-9", "ias-28", "pcg"]
  - topic: Créances rattachées et prêts
    ifrsTreatment: Évaluation au coût amorti ou à la juste valeur et dépréciation selon le modèle des pertes attendues (IFRS 9).
    pcgTreatment: Comptabilisation à la valeur nominale, dépréciation en fonction du risque de non-recouvrement apprécié au cas par cas.
    auditImpact: Apprécier le risque de recouvrement, la cohérence des dépréciations et l'identification des contreparties liées.
    sourceIds: ["ifrs-9", "pcg"]

