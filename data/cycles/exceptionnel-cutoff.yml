slug: exceptionnel-cutoff
family: COMPTE_RESULTAT
title: Charges et produits exceptionnels et cut-off
summary: >
  Cycle relatif aux charges et produits exceptionnels (classes 67 et 77) et à leur
  séparation des exercices : appréciation du caractère réellement exceptionnel et non
  récurrent, qualité des pièces justificatives et cut-off. Zone sensible au reclassement
  opportuniste et au lissage du résultat.

pcgAccounts: ["67", "77"]
probantSiloIds: ["resultat-exceptionnel"]
probantCloisons: ["resultat"]

applicableStandards:
  - id: pcg
    label: PCG — Charges et produits exceptionnels (classes 67 et 77)
    type: PCG
    status: OBLIGATOIRE
  - id: ias-1
    label: IAS 1 — Présentation des états financiers
    type: IAS
    status: OBLIGATOIRE
    note: Interdit la présentation d'éléments « extraordinaires » distincts.
  - id: isa-240
    label: ISA 240 — Fraude
    type: ISA
    status: OBLIGATOIRE
    note: Risque de reclassement opportuniste et de lissage du résultat.
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-330
    label: ISA 330 — Réponses aux risques évalués
    type: ISA
    status: OBLIGATOIRE
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-520
    label: ISA 520 — Procédures analytiques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-560
    label: ISA 560 — Événements postérieurs à la clôture
    type: ISA
    status: OBLIGATOIRE
    note: Pertinent pour le cut-off et les événements postérieurs.

thresholds:
  - label: Caractère exceptionnel des opérations (PCG)
    value: Opérations non liées à l'activité courante, justifiées par leur nature exceptionnelle
    status: OBLIGATOIRE
    sourceIds: ["pcg"]
  - label: Rattachement des charges et produits exceptionnels à l'exercice
    value: Comptabilisation sur l'exercice du fait générateur, pièces justificatives à l'appui
    status: OBLIGATOIRE
    sourceIds: ["pcg"]
  - label: Poids de l'exceptionnel dans le résultat
    value: Seuil d'alerte interne PROBANT déclenchant un examen approfondi, à adapter au mandat
    status: PARAMETRABLE
    sourceIds: ["isa-240"]

materiality:
  globalMateriality:
    benchmark: Résultat avant impôt normalisé
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 5 % à 10 % du résultat avant impôt normalisé
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Réduire en présence d'un risque de reclassement opportuniste ou de lissage du résultat.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Résultat exceptionnel / Résultat net
    formula: Résultat exceptionnel / Résultat net de l'exercice
    alertThreshold: Poids élevé de l'exceptionnel dans le résultat
    interpretation: Un résultat fortement dépendant de l'exceptionnel peut révéler un pilotage du résultat.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520", "isa-240"]
  - name: Exceptionnel / Chiffre d'affaires
    formula: (Produits exceptionnels - Charges exceptionnelles) / Chiffre d'affaires
    alertThreshold: Variation atypique vs N-1 ou montant inhabituel
    interpretation: Identifie des opérations exceptionnelles inhabituelles ou récurrentes mal classées.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Revue analytique des mouvements exceptionnels
    objective: Identifier les opérations exceptionnelles atypiques et apprécier leur récurrence.
    method: Analyser le détail des comptes 67 et 77 et comparer la nature des opérations à N-1.
    expectedVariation: Opérations ponctuelles, justifiées et non récurrentes.
    anomalyTrigger: Opérations récurrentes classées en exceptionnel, montants élevés en fin d'exercice.
    benchmark: ["N-1", "Nature des opérations"]
    assertions: ["Présentation", "Rattachement", "Exactitude"]
    sourceIds: ["isa-520", "isa-240"]
  - name: Analyse du classement courant / exceptionnel
    objective: Détecter les reclassements opportunistes vers ou depuis l'exceptionnel.
    method: Examiner les reclassements significatifs entre résultat courant et exceptionnel.
    expectedVariation: Classement cohérent avec la nature réelle des opérations.
    anomalyTrigger: Charges courantes reclassées en exceptionnel, produits récurrents en exceptionnel.
    benchmark: ["N-1", "Définition PCG de l'exceptionnel"]
    assertions: ["Présentation"]
    sourceIds: ["isa-240", "isa-520"]

detailTests:
  - name: Analyse détaillée des opérations exceptionnelles et de leurs pièces justificatives
    nature: Test de détail
    extent: Opérations exceptionnelles significatives + échantillon sur le solde
    timing: Clôture
    samplingMethod: Sélection ciblée + échantillonnage selon ISA 530
    evidenceRequired:
      - Pièces justificatives des opérations
      - Contrats et actes (cessions, litiges, sinistres)
      - Justification du caractère exceptionnel
    assertions: ["Existence", "Présentation", "Exactitude"]
    sourceIds: ["isa-500", "isa-530"]
  - name: Test du cut-off des charges et produits exceptionnels
    nature: Test de détail
    extent: Opérations exceptionnelles autour de la clôture
    timing: Clôture et post-clôture
    samplingMethod: Sélection ciblée sur les opérations proches de la clôture
    evidenceRequired:
      - Date du fait générateur
      - Pièces justificatives
      - Événements postérieurs liés
    assertions: ["Rattachement"]
    sourceIds: ["isa-500", "isa-560"]
  - name: Vérification des approbations des opérations exceptionnelles
    nature: Test de détail
    extent: Opérations exceptionnelles significatives
    timing: Clôture
    samplingMethod: Sélection ciblée sur les montants les plus élevés
    evidenceRequired:
      - Approbations de la direction ou des organes sociaux
      - Procès-verbaux
      - Justification de l'autorisation
    assertions: ["Existence", "Droits et obligations"]
    sourceIds: ["isa-240", "isa-330"]

risks:
  - name: Reclassement opportuniste et lissage du résultat
    category: RISQUE_FRAUDE
    description: >
      Reclassement de charges ou de produits récurrents en exceptionnel (ou inversement) pour
      embellir le résultat courant ou lisser le résultat d'un exercice à l'autre.
    indicators:
      - Charges courantes reclassées en exceptionnel
      - Produits exceptionnels récurrents d'un exercice à l'autre
      - Opérations exceptionnelles importantes en fin d'exercice
    response:
      - Analyser la nature réelle des opérations classées en exceptionnel
      - Examiner les reclassements courant / exceptionnel
      - Apprécier la récurrence des opérations sur plusieurs exercices
    sourceIds: ["isa-240", "isa-520"]
  - name: Erreur de cut-off des opérations exceptionnelles (défaillance du contrôle)
    category: RISQUE_CONTROLE
    description: Charges ou produits exceptionnels rattachés au mauvais exercice faute de contrôle du fait générateur.
    indicators:
      - Opérations exceptionnelles enregistrées sans contrôle de la date du fait générateur
      - Événements postérieurs non analysés
    response:
      - Tester le cut-off des opérations exceptionnelles
      - Examiner les événements postérieurs à la clôture
    sourceIds: ["isa-315", "isa-330", "isa-560"]
  - name: Pièces justificatives insuffisantes
    category: RISQUE_INHERENT
    description: Opérations exceptionnelles faiblement documentées, rendant difficile l'appréciation de leur réalité et de leur nature.
    indicators:
      - Absence de contrat ou d'acte à l'appui de l'opération
      - Justification du caractère exceptionnel non documentée
    response:
      - Exiger les pièces justificatives
      - Corroborer la réalité et la nature de l'opération
    sourceIds: ["isa-500"]

ifrsVsPcg:
  - topic: Présentation des éléments exceptionnels / extraordinaires
    ifrsTreatment: >
      IAS 1 interdit la présentation d'éléments « exceptionnels » ou « extraordinaires » sur des
      lignes distinctes ; tous les produits et charges relèvent du résultat, avec information en annexe
      sur les éléments significatifs.
    pcgTreatment: >
      Le PCG conserve un résultat exceptionnel présenté séparément (classes 67 et 77), distinct du
      résultat d'exploitation et du résultat financier.
    auditImpact: >
      Vérifier le classement selon le référentiel : en PCG, le bien-fondé du caractère exceptionnel ;
      en IFRS, l'absence de rubrique « exceptionnel » et la qualité de l'information en annexe.
    sourceIds: ["ias-1", "pcg"]

officialSources:
  - id: pcg
    label: PCG — Charges et produits exceptionnels (classes 67 et 77)
    type: PCG
    url: https://www.anc.gouv.fr/fr/reglementation
    status: OBLIGATOIRE
  - id: ias-1
    label: IAS 1 — Presentation of Financial Statements
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements.html
