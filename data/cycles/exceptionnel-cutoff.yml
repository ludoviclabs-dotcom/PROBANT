    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE

keyPoints:
  - Apprécier le caractère réellement exceptionnel et non récurrent des opérations classées en 67 / 77.
  - Examiner les reclassements courant / exceptionnel (risque de lissage et de pilotage du résultat).
  - Tester le cut-off et exiger des pièces justificatives à l'appui des opérations exceptionnelles.
  - En IFRS, vérifier l'absence de rubrique « exceptionnel » distincte (IAS 1) et l'information en annexe.

relatedCycles:
  - cutoff-separation-exercices
  - evenements-posterieurs
  - controle-interne-fraude

reviewStatus: VALIDATED
