keyPoints:
  - Obtenir des confirmations bancaires exhaustives des positions dérivées (notionnel, sens, juste valeur).
  - Sécuriser les justes valeurs par des valorisations indépendantes, surtout pour les niveaux 2/3.
  - Vérifier la documentation de couverture à l'origine et les tests d'efficacité.
  - Rechercher les dérivés incorporés non séparés dans les contrats commerciaux.
  - Sous IFRS, tous les dérivés sont au bilan à la juste valeur ; le PCG privilégie symétrie et annexe.

