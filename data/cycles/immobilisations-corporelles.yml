slug: immobilisations-corporelles
family: ACTIF_IMMOBILISE
title: Immobilisations corporelles
summary: >
  Cycle relatif à la comptabilisation, l'existence, la propriété, l'évaluation,
  l'amortissement, la dépréciation et la sortie des immobilisations corporelles,
  y compris les immobilisations en cours et l'approche par composants.

pcgAccounts: ["21", "23", "281", "291"]
probantSiloIds: ["immobilisations-corporelles"]
probantCloisons: ["bilan-actif"]

applicableStandards:
  - id: ias-16
    label: IAS 16 — Immobilisations corporelles
    type: IAS
    status: OBLIGATOIRE
    note: Applicable aux entités en référentiel IFRS.
  - id: pcg-214-13
    label: PCG art. 214-13 — Plan d'amortissement
    type: PCG
    status: OBLIGATOIRE
  - id: ias-36
    label: IAS 36 — Dépréciation d'actifs
    type: IAS
    status: OBLIGATOIRE
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-330
    label: ISA 330 — Réponses aux risques évalués
    type: ISA
    status: OBLIGATOIRE
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-520
    label: ISA 520 — Procédures analytiques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-540
    label: ISA 540 (révisée) — Estimations comptables
    type: ISA
    status: OBLIGATOIRE
    note: Pertinent pour les durées d'utilité et la dépréciation.

thresholds:
  - label: Écart de taux d'amortissement significatif vs N-1
    value: 5 points (paramètre interne PROBANT, à adapter au mandat)
    status: PARAMETRABLE
    sourceIds: ["pcg-214-13"]
    caveat: Seuil indicatif interne, non opposable.
  - label: Approche par composants
    value: Comptabilisation séparée des composants significatifs à durée d'utilité distincte
    status: OBLIGATOIRE
    sourceIds: ["ias-16", "pcg-214-13"]

materiality:
  globalMateriality:
    benchmark: Total bilan ou résultat avant impôt normalisé selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt normalisé
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Plutôt 60 % en cas de risque élevé ou d'anomalies historiques.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Taux d'amortissement
    formula: Dotations aux amortissements de l'exercice / Valeur brute des immobilisations amortissables
    alertThreshold: Variation > 5 pts vs N-1 à investiguer
    interpretation: Détecte un changement de durée d'utilité, une erreur de base ou une dotation anormale.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Capex / Chiffre d'affaires
    formula: Acquisitions d'immobilisations corporelles / Chiffre d'affaires
    alertThreshold: Variation significative vs budget ou N-1
    interpretation: Identifie un investissement inhabituel ou une capitalisation abusive de charges.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Taux de vétusté (VNC / valeur brute)
    formula: Valeur nette comptable / Valeur brute des immobilisations
    alertThreshold: Ratio très faible ou chute brutale à investiguer
    interpretation: Indique le vieillissement des actifs et un besoin de renouvellement.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Analyse de variation des immobilisations
    objective: Identifier acquisitions, cessions, reclassements et sorties inhabituels.
    method: Comparer N/N-1, le budget, le tableau des mouvements et la balance générale.
    expectedVariation: Variation cohérente avec le plan d'investissement approuvé.
    anomalyTrigger: Acquisition importante non budgétée, sortie non documentée, variation inexpliquée.
    benchmark: ["N-1", "Budget", "Plan capex"]
    assertions: ["Existence", "Exhaustivité", "Évaluation", "Droits et obligations"]
    sourceIds: ["isa-520", "nep-520"]
  - name: Revue analytique du taux d'amortissement par catégorie
    objective: Détecter une rupture de méthode ou une durée d'utilité incohérente.
    method: Comparer le taux d'amortissement par catégorie N vs N-1.
    expectedVariation: Stabilité hors changement justifié et documenté en annexe.
    anomalyTrigger: Variation > 5 pts sans justification.
    benchmark: ["N-1"]
    assertions: ["Évaluation", "Rattachement"]
    sourceIds: ["isa-520", "pcg-214-13"]

detailTests:
  - name: Rapprochement fichier des immobilisations / balance générale
    nature: Test substantif
    extent: Rapprochement exhaustif ; ciblé sur les additions significatives
    timing: Clôture
    samplingMethod: Exhaustif sur le rapprochement ; sélection ciblée sur les acquisitions
    evidenceRequired:
      - Fichier des immobilisations
      - Balance générale
      - Tableau des mouvements
    assertions: ["Exhaustivité", "Exactitude"]
    sourceIds: ["isa-500", "isa-330"]
  - name: Test des acquisitions significatives
    nature: Test de détail
    extent: Acquisitions significatives + échantillon sur le solde restant
    timing: Clôture ou intérim avec roll-forward
    samplingMethod: Sélection ciblée + échantillonnage selon ISA 530
    evidenceRequired:
      - Factures
      - Contrats d'acquisition
      - Bons de réception
      - PV de mise en service
      - Justification de la capitalisation
    assertions: ["Existence", "Droits et obligations", "Évaluation"]
    sourceIds: ["isa-500", "isa-530"]
  - name: Inspection physique d'un échantillon d'actifs
    nature: Inspection
    extent: Échantillon d'actifs significatifs
    timing: Clôture ou date proche
    samplingMethod: Sélection ciblée sur les actifs à forte valeur
    evidenceRequired:
      - Fichier des immobilisations
      - Constat physique
      - Titres de propriété
    assertions: ["Existence", "Droits et obligations"]
    sourceIds: ["isa-500", "isa-501"]

risks:
  - name: Capitalisation abusive de charges
    category: RISQUE_FRAUDE
    description: Majoration du résultat via l'activation de dépenses qui auraient dû être passées en charges.
    indicators:
      - Hausse inhabituelle des capex
      - Baisse artificielle des charges d'exploitation
      - Acquisitions proches de la clôture
    response:
      - Tester les acquisitions significatives
      - Analyser la nature des dépenses activées
      - Comparer aux budgets capex
    sourceIds: ["isa-240", "isa-315", "isa-330"]
  - name: Durées d'utilité excessives / absence de dépréciation
    category: RISQUE_INHERENT
    description: Jugements subjectifs sur les durées et l'existence d'indices de perte de valeur.
    indicators:
      - Actifs techniquement obsolètes maintenus à l'actif
      - Taux de vétusté élevé sans dépréciation
    response:
      - Recalculer les dotations
      - Rechercher les indices de dépréciation (IAS 36)
    sourceIds: ["isa-540", "ias-36"]
  - name: Absence de contrôle des cessions et mises au rebut
    category: RISQUE_CONTROLE
    description: Sorties d'actifs non autorisées ou non comptabilisées.
    indicators:
      - Absence de procédure d'autorisation des cessions
      - Écarts d'inventaire physique
    response:
      - Tester le contrôle d'autorisation des sorties
      - Rapprocher inventaire physique et fichier
    sourceIds: ["isa-315", "isa-330"]

ifrsVsPcg:
  - topic: Approche par composants
    ifrsTreatment: Obligatoire (IAS 16) — chaque composant significatif est amorti séparément.
    pcgTreatment: Prévue par le PCG (art. 214-13) selon les règles françaises applicables.
    auditImpact: Vérifier l'identification des composants, les durées et la cohérence des amortissements.
    sourceIds: ["ias-16", "pcg-214-13"]
  - topic: Modèle de réévaluation
    ifrsTreatment: Option du modèle de la réévaluation à la juste valeur (IAS 16).
    pcgTreatment: Réévaluation légale uniquement, dans le cadre fixé par la réglementation ANC.
    auditImpact: Vérifier l'éligibilité et la documentation de toute réévaluation.
    sourceIds: ["ias-16", "pcg"]

officialSources:
  - id: ias-16
    label: IAS 16 — Property, Plant and Equipment
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment.html
    status: OBLIGATOIRE
  - id: pcg-214-13
    label: PCG art. 214-13
    type: PCG
    url: https://www.anc.gouv.fr/fr/reglementation
    status: OBLIGATOIRE
  - id: ias-36
    label: IAS 36 — Impairment of Assets
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets.html
    status: OBLIGATOIRE

keyPoints:
  - Documenter le tableau de mouvement des immobilisations (acquisitions, cessions, dotations).
  - Vérifier la cohérence entre plan d'amortissement et durée d'utilité économique.
  - Alerter si le taux d'amortissement varie de plus de 5 pts vs N-1 sans justification en annexe.
  - PROBANT détecte automatiquement les ruptures de plan d'amortissement (silo immobilisations-corporelles).

relatedCycles:
  - dotations-amortissements-depreciations
  - impairment-goodwill-actifs
  - immobilisations-financieres

reviewStatus: VALIDATED
