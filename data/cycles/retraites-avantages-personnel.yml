slug: retraites-avantages-personnel
family: PASSIF_ENGAGEMENTS
title: Provisions retraites et avantages du personnel
summary: >
  Cycle relatif aux engagements de retraite et avantages du personnel (indemnités
  de fin de carrière, régimes à prestations définies) : existence et exhaustivité
  des engagements, qualité des hypothèses actuarielles (taux d'actualisation,
  turnover, mortalité), évaluation de l'obligation et recours à un expert.

pcgAccounts: ["153", "158"]
probantSiloIds: ["provisions"]
probantCloisons: ["bilan-passif"]

applicableStandards:
  - id: ias-19
    label: IAS 19 — Avantages du personnel
    type: IAS
    status: OBLIGATOIRE
    note: Comptabilisation obligatoire au bilan en référentiel IFRS ; écarts actuariels en OCI.
  - id: pcg
    label: PCG — Engagements de retraite et avantages assimilés
    type: PCG
    status: OBLIGATOIRE
    note: Comptabilisation optionnelle ; à défaut, mention en annexe (engagement hors bilan).
  - id: isa-540
    label: ISA 540 (révisée) — Estimations comptables
    type: ISA
    status: OBLIGATOIRE
    note: Cœur du cycle — l'évaluation actuarielle est une estimation comptable significative.
  - id: isa-620
    label: ISA 620 — Utilisation des travaux d'un expert de l'auditeur
    type: ISA
    status: OBLIGATOIRE
    note: Recours fréquent à un actuaire (expert de l'auditeur ou de l'entité).
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE

thresholds:
  - label: Comptabilisation de l'engagement (référentiel IFRS)
    value: Obligation au titre des régimes à prestations définies évaluée selon la méthode des unités de crédit projetées
    status: OBLIGATOIRE
    sourceIds: ["ias-19"]
  - label: Information / comptabilisation en référentiel PCG
    value: Comptabilisation en provision (méthode préférentielle) ou mention en annexe au minimum
    status: OBLIGATOIRE
    sourceIds: ["pcg"]
  - label: Écart de taux d'actualisation significatif vs N-1
    value: 50 points de base (paramètre interne PROBANT, à adapter au mandat)
    status: PARAMETRABLE
    sourceIds: ["isa-540"]
    caveat: Seuil indicatif interne d'alerte sur l'hypothèse d'actualisation, non opposable.

materiality:
  globalMateriality:
    benchmark: Résultat avant impôt normalisé ou total bilan selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 5 % à 10 % du résultat avant impôt, ou 1 % à 2 % du total bilan
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au poids des
      engagements sociaux dans les comptes.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Plutôt 60 % compte tenu de la sensibilité aux hypothèses actuarielles.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Engagement / Masse salariale
    formula: Obligation au titre des engagements de retraite / Masse salariale brute
    alertThreshold: Variation significative vs N-1 ou écart sectoriel à investiguer
    interpretation: Mesure le poids relatif de l'engagement ; un ratio atypique peut révéler des hypothèses biaisées.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Coût des services / Masse salariale
    formula: Coût des services rendus de l'exercice / Masse salariale brute
    alertThreshold: Variation > N-1 sans évolution d'effectif correspondante
    interpretation: Suit la charge récurrente de l'exercice ; détecte une incohérence avec l'évolution des effectifs.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Sensibilité au taux d'actualisation
    formula: Variation de l'obligation pour une variation de 50 bps du taux d'actualisation
    alertThreshold: Sensibilité élevée combinée à un taux atypique vs marché à investiguer
    interpretation: Apprécie l'effet d'une hypothèse clé ; une forte sensibilité accroît le risque d'évaluation.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-540"]

analyticalProcedures:
  - name: Revue de variation de l'engagement
    objective: Expliquer la variation de l'obligation entre N-1 et N (coût des services, intérêts, écarts actuariels, prestations payées).
    method: Analyser le tableau de passage (roll-forward) fourni par l'actuaire et le rapprocher de la comptabilité.
    expectedVariation: Variation cohérente avec l'évolution des effectifs, des salaires et du taux d'actualisation.
    anomalyTrigger: Écart actuariel important non expliqué, variation incohérente avec l'évolution de la population.
    benchmark: ["N-1"]
    assertions: ["Évaluation", "Exhaustivité"]
    sourceIds: ["isa-520", "isa-540"]
  - name: Cohérence des hypothèses actuarielles avec le marché
    objective: Apprécier le caractère raisonnable du taux d'actualisation, du taux de revalorisation et des tables de mortalité.
    method: Comparer les hypothèses retenues aux références de marché (taux obligataires corporate AA, tables INSEE/sectorielles) et à N-1.
    expectedVariation: Hypothèses dans la fourchette de marché et stables hors justification documentée.
    anomalyTrigger: Taux d'actualisation hors marché, turnover ou table de mortalité incohérents avec la population.
    benchmark: ["N-1", "Références de marché"]
    assertions: ["Évaluation"]
    sourceIds: ["isa-520", "isa-540"]

detailTests:
  - name: Examen du rapport de l'actuaire
    nature: Inspection
    extent: Rapport actuariel complet à la clôture
    timing: Clôture
    samplingMethod: Exhaustif sur le rapport ; sélection ciblée sur les hypothèses clés
    evidenceRequired:
      - Rapport de l'actuaire
      - Détail des hypothèses (taux d'actualisation, turnover, mortalité, revalorisation)
      - Tableau de passage de l'obligation
    assertions: ["Évaluation", "Exhaustivité"]
    sourceIds: ["isa-540", "ias-19"]
  - name: Appréciation de la compétence et de l'objectivité de l'actuaire
    nature: Test substantif
    extent: Évaluation du recours à l'expert
    timing: Planification et clôture
    samplingMethod: Sélection ciblée
    evidenceRequired:
      - Lettre de mission de l'actuaire
      - Qualifications et indépendance de l'expert
      - Adéquation des données transmises à l'actuaire
    assertions: ["Évaluation"]
    sourceIds: ["isa-620"]
  - name: Rapprochement des données de population avec la paie
    nature: Test de détail
    extent: Données d'effectifs et d'ancienneté transmises à l'actuaire
    timing: Clôture
    samplingMethod: Rapprochement global + échantillon individuel selon ISA 530
    evidenceRequired:
      - États d'effectifs et d'ancienneté
      - Journal de paie / DSN
      - Réconciliation population actuarielle vs paie
    assertions: ["Exhaustivité", "Exactitude"]
    sourceIds: ["isa-500", "isa-530"]
  - name: Recalcul de sensibilité et contrôle des hypothèses clés
    nature: Test substantif
    extent: Hypothèses significatives (taux d'actualisation, revalorisation)
    timing: Clôture
    samplingMethod: Sélection ciblée sur les hypothèses sensibles
    evidenceRequired:
      - Analyses de sensibilité de l'actuaire
      - Justification des hypothèses retenues
      - Comparaison aux références de marché
    assertions: ["Évaluation"]
    sourceIds: ["isa-540"]

risks:
  - name: Hypothèses actuarielles irréalistes ou biaisées
    category: RISQUE_INHERENT
    description: >
      Choix d'hypothèses (taux d'actualisation, turnover, mortalité, revalorisation)
      conduisant à une sous-évaluation ou une surévaluation de l'engagement, le cas
      échéant influencé par un biais de la direction.
    indicators:
      - Taux d'actualisation hors fourchette de marché
      - Turnover élevé non corroboré par l'historique
      - Tables de mortalité ou hypothèses de revalorisation inadaptées
    response:
      - Comparer les hypothèses aux références de marché et à N-1
      - Recourir à un actuaire (ISA 620) et tester la sensibilité
    sourceIds: ["isa-540", "isa-620"]
  - name: Population incomplète ou erronée transmise à l'actuaire
    category: RISQUE_CONTROLE
    description: Défaut de contrôle sur l'exhaustivité et l'exactitude des données d'effectifs servant de base au calcul actuariel.
    indicators:
      - Absence de réconciliation entre la population actuarielle et la paie
      - Écarts d'effectifs non expliqués vs N-1
    response:
      - Rapprocher les données de population avec la paie / DSN
      - Tester le contrôle de transmission des données à l'actuaire
    sourceIds: ["isa-315", "isa-500"]
  - name: Engagements omis (non comptabilisés ni mentionnés)
    category: RISQUE_INHERENT
    description: >
      Indemnités de fin de carrière ou autres avantages à long terme non recensés,
      non provisionnés ni mentionnés en annexe.
    indicators:
      - Convention collective prévoyant des IFC sans engagement comptabilisé
      - Avantages (médailles du travail, retraites supplémentaires) non identifiés
    response:
      - Recenser les obligations issues des conventions collectives et accords d'entreprise
      - Vérifier la couverture exhaustive des régimes par l'évaluation actuarielle
    sourceIds: ["ias-19", "isa-540"]

ifrsVsPcg:
  - topic: Comptabilisation de l'engagement de retraite
    ifrsTreatment: >
      IAS 19 impose la comptabilisation au bilan de l'obligation nette au titre des
      régimes à prestations définies, évaluée selon la méthode des unités de crédit
      projetées ; les écarts actuariels sont comptabilisés en autres éléments du
      résultat global (OCI).
    pcgTreatment: >
      Le PCG laisse une option : comptabilisation d'une provision (méthode
      préférentielle) OU mention de l'engagement en annexe en engagement hors bilan ;
      les écarts actuariels transitent par le résultat lorsqu'ils sont comptabilisés.
    auditImpact: >
      Identifier le référentiel et l'option retenue ; en cas de simple mention en
      annexe, vérifier l'exhaustivité de l'information ; en cas de comptabilisation,
      contrôler l'évaluation actuarielle et le traitement des écarts actuariels.
    sourceIds: ["ias-19", "pcg"]

