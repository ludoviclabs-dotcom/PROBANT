    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE

keyPoints:
  - Apprécier le caractère raisonnable des hypothèses actuarielles (taux d'actualisation, turnover, mortalité) par rapport au marché.
  - Recourir à un actuaire et évaluer sa compétence et son objectivité (ISA 620).
  - Rapprocher la population transmise à l'actuaire des données de paie (exhaustivité et exactitude).
  - Vérifier l'exhaustivité du recensement des engagements (IFC, avantages à long terme).
  - "Identifier le référentiel : IAS 19 impose la comptabilisation au bilan, le PCG laisse une option (provision ou annexe)."

