    status: OBLIGATOIRE

keyPoints:
  - Justifier chaque charge constatée d'avance par un contrat et recalculer le prorata temporis.
  - Vérifier le rattachement des charges à l'exercice (cut-off) autour de la clôture.
  - Apprécier la recouvrabilité des autres créances anciennes et le besoin de dépréciation.
  - Contrôler l'apurement post-clôture des soldes significatifs.
  - PROBANT signale automatiquement les CCA en forte variation et les autres créances non apurées (silo cca).

