keyPoints:
  - Circulariser exhaustivement les banques et les avocats pour détecter les engagements et sûretés non mentionnés.
  - Recouper l'annexe avec les contrats, les actes de nantissement et les procès-verbaux des organes sociaux.
  - Examiner les événements postérieurs à la clôture révélateurs d'engagements ou de litiges (ISA 560).
  - Obtenir une lettre d'affirmation couvrant l'exhaustivité des engagements et passifs éventuels (ISA 580).
  - Veiller au périmètre des engagements à fournir, notamment ceux donnés au profit de parties liées.

