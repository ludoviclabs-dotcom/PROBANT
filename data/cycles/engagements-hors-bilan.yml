slug: engagements-hors-bilan
family: PASSIF_ENGAGEMENTS
title: Engagements hors bilan et passifs éventuels
summary: >
  Cycle relatif aux engagements donnés et reçus et aux passifs éventuels non
  comptabilisés (garanties, cautions, avals, nantissements, litiges, engagements
  de retraite non comptabilisés) : exhaustivité du recensement et qualité de
  l'information fournie en annexe.

pcgAccounts: ["801", "802"]
probantSiloIds: []
probantCloisons: ["annexe"]

applicableStandards:
  - id: ias-37
    label: IAS 37 — Provisions, passifs et actifs éventuels
    type: IAS
    status: OBLIGATOIRE
    note: Information en annexe sur les passifs éventuels.
  - id: ias-1
    label: IAS 1 — Présentation des états financiers
    type: IAS
    status: OBLIGATOIRE
    note: Exigences d'information en annexe.
  - id: legifrance-code-commerce
    label: Code de commerce — Engagements financiers en annexe
    type: CODE_COMMERCE
    status: OBLIGATOIRE
    note: Mention obligatoire des engagements financiers dans l'annexe des comptes.
  - id: isa-501
    label: ISA 501 — Éléments probants (litiges)
    type: ISA
    status: OBLIGATOIRE
  - id: isa-560
    label: ISA 560 — Événements postérieurs à la clôture
    type: ISA
    status: OBLIGATOIRE
  - id: isa-505
    label: ISA 505 — Confirmations externes
    type: ISA
    status: OBLIGATOIRE
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE

thresholds:
  - label: Information en annexe d'un passif éventuel
    value: Information requise lorsque l'obligation est possible (non probable) ou non évaluable de façon fiable
    status: OBLIGATOIRE
    sourceIds: ["ias-37"]
  - label: Mention des engagements financiers
    value: Engagements donnés et reçus (cautions, avals, garanties, nantissements) à mentionner en annexe
    status: OBLIGATOIRE
    sourceIds: ["legifrance-code-commerce", "ias-1"]

materiality:
  globalMateriality:
    benchmark: Total bilan, capitaux propres ou résultat avant impôt selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. La significativité s'apprécie aussi de
      manière qualitative pour une information d'annexe.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Plutôt 60 % compte tenu du risque d'omission propre au hors bilan.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes ; à pondérer par le caractère qualitatif de l'information.

ratios:
  - name: Engagements donnés / Capitaux propres
    formula: Total des engagements donnés hors bilan / Capitaux propres
    alertThreshold: Ratio élevé ou en forte hausse vs N-1 à investiguer
    interpretation: Mesure l'exposition hors bilan relativement à la surface financière.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Garanties données / Endettement
    formula: Garanties et sûretés données / Dettes financières totales
    alertThreshold: Niveau élevé de sûretés à rapprocher des covenants
    interpretation: Indique le degré de nantissement de l'actif et la marge de manœuvre financière.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Litiges / Résultat
    formula: Montants en jeu dans les litiges non provisionnés / Résultat avant impôt
    alertThreshold: Enjeu significatif au regard du résultat à investiguer
    interpretation: Apprécie l'exposition liée aux contentieux non comptabilisés.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520", "isa-501"]

analyticalProcedures:
  - name: Revue de l'annexe relative aux engagements
    objective: Apprécier la cohérence et l'exhaustivité de l'information sur les engagements hors bilan.
    method: Comparer l'annexe N/N-1, la rapprocher des contrats, des sûretés et des PV, et examiner les mouvements.
    expectedVariation: Information cohérente avec l'évolution de l'endettement, des contrats et des contentieux.
    anomalyTrigger: Disparition non expliquée d'un engagement, absence d'engagement attendu (cautions, nantissements).
    benchmark: ["N-1"]
    assertions: ["Exhaustivité", "Présentation"]
    sourceIds: ["isa-520"]
  - name: Recoupement des sûretés avec les financements
    objective: Détecter des garanties ou nantissements non mentionnés en annexe.
    method: Rapprocher les contrats de financement, les actes de nantissement et les confirmations bancaires de l'annexe.
    expectedVariation: Toute sûreté attachée à un financement figure dans l'annexe.
    anomalyTrigger: Sûreté mentionnée par la banque mais absente de l'annexe.
    benchmark: ["Contrats de financement", "Confirmations bancaires"]
    assertions: ["Exhaustivité", "Présentation"]
    sourceIds: ["isa-505", "isa-501"]

detailTests:
  - name: Confirmations bancaires (engagements et sûretés)
    nature: Confirmation externe
    extent: Ensemble des établissements bancaires
    timing: Clôture
    samplingMethod: Exhaustif sur les banques en relation
    evidenceRequired:
      - Réponses des banques (cautions, avals, garanties, nantissements)
      - Contrats de financement
      - Actes de sûretés
    assertions: ["Exhaustivité", "Présentation"]
    sourceIds: ["isa-505", "isa-501"]
  - name: Confirmation des avocats et conseils
    nature: Confirmation externe
    extent: Ensemble des dossiers contentieux significatifs
    timing: Clôture
    samplingMethod: Sélection ciblée sur les litiges significatifs
    evidenceRequired:
      - Réponses des avocats
      - PV de conseil d'administration et d'assemblée
      - Mises en demeure et assignations
    assertions: ["Exhaustivité", "Présentation"]
    sourceIds: ["isa-501", "isa-505"]
  - name: Revue des contrats et procès-verbaux
    nature: Inspection
    extent: Contrats significatifs, PV des organes sociaux de l'exercice et postérieurs
    timing: Clôture
    samplingMethod: Sélection ciblée
    evidenceRequired:
      - Contrats (garanties, cautions, engagements d'achat/vente, crédit-bail)
      - PV des conseils et assemblées
      - Conventions de garantie
    assertions: ["Exhaustivité", "Droits et obligations", "Présentation"]
    sourceIds: ["isa-501", "isa-500"]
  - name: Examen des événements postérieurs à la clôture
    nature: Test substantif
    extent: Période entre la clôture et la date du rapport
    timing: Fin de mission
    samplingMethod: Sélection ciblée sur les événements révélateurs d'engagements
    evidenceRequired:
      - PV postérieurs à la clôture
      - Réponses des avocats actualisées
      - Lettre d'affirmation de la direction
    assertions: ["Exhaustivité", "Présentation"]
    sourceIds: ["isa-560", "isa-501"]

risks:
  - name: Omission d'engagements hors bilan
    category: RISQUE_FRAUDE
    description: >
      Engagements donnés (garanties, cautions, avals) volontairement non communiqués
      pour masquer une exposition ou un risque financier.
    indicators:
      - Garanties accordées à des parties liées non mentionnées
      - Sûretés confirmées par les banques mais absentes de l'annexe
    response:
      - Circulariser exhaustivement les banques et les avocats
      - Recouper l'annexe avec les contrats, PV et confirmations
    sourceIds: ["isa-240", "isa-505"]
  - name: Annexe incomplète ou imprécise
    category: RISQUE_CONTROLE
    description: Défaut de procédure de recensement des engagements conduisant à une information d'annexe lacunaire.
    indicators:
      - Absence de suivi centralisé des engagements donnés/reçus
      - Information d'annexe générique sans chiffrage
    response:
      - Tester le processus de recensement des engagements
      - Vérifier le chiffrage et la ventilation des engagements en annexe
    sourceIds: ["isa-315", "ias-1"]
  - name: Litiges non communiqués
    category: RISQUE_INHERENT
    description: Contentieux ou réclamations connus de la direction mais non portés à la connaissance de l'auditeur.
    indicators:
      - Honoraires d'avocats sans dossier identifié
      - Correspondances ou mises en demeure non transmises
    response:
      - Circulariser les avocats et examiner les honoraires juridiques
      - Obtenir une lettre d'affirmation couvrant les litiges et engagements
    sourceIds: ["isa-501", "isa-580"]

ifrsVsPcg:
  - topic: Passifs éventuels et information en annexe
    ifrsTreatment: >
      IAS 37 prévoit l'information en annexe des passifs éventuels (obligation
      possible non probable, ou obligation non évaluable de façon fiable), sans
      comptabilisation au bilan.
    pcgTreatment: >
      Le PCG et le Code de commerce imposent la mention en annexe des engagements
      financiers et des risques (cautions, avals, garanties, nantissements) ;
      l'approche est convergente sur le principe de l'information.
    auditImpact: >
      Vérifier que le périmètre des engagements et passifs éventuels à mentionner
      est exhaustif et cohérent entre référentiels ; attention au périmètre
      d'engagements requis (parties liées, sûretés réelles).
    sourceIds: ["ias-37", "legifrance-code-commerce"]

