keyPoints:
  - Tester le cut-off des achats et rechercher activement les passifs omis (FNP, décaissements post-clôture).
  - Analyser les montants ronds, le fractionnement de factures et les fournisseurs nouveaux ou non référencés.
  - Confronter les dépenses sensibles aux dispositifs anticorruption (cartographie des risques, évaluation des tiers).
  - PROBANT détecte les anomalies de paiements et la concentration fournisseurs (silo achats-charges-externes).

