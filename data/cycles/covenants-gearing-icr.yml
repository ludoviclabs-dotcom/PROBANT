slug: covenants-gearing-icr
family: CAPITAUX_PROPRES_FINANCEMENT
title: Covenants, gearing et ICR
summary: >
  Cycle transverse relatif au respect des covenants bancaires et aux ratios financiers
  associés (gearing, ICR, leverage, DSCR, current ratio). Couvre le recalcul des ratios
  selon les définitions contractuelles, la classification de la dette courant/non courant
  et le lien avec la continuité d'exploitation.

pcgAccounts: ["16"]
probantSiloIds: ["dettes-financieres"]
probantCloisons: ["bilan-passif"]

applicableStandards:
  - id: ifrs-7
    label: IFRS 7 — Instruments financiers, informations à fournir
    type: IFRS
    status: OBLIGATOIRE
    note: Informations sur les risques de liquidité et les clauses contractuelles.
  - id: ias-1
    label: IAS 1 — Présentation des états financiers
    type: IAS
    status: OBLIGATOIRE
    note: Classification courant / non courant et reclassement en cas de bris de covenant.
  - id: ifrs-9
    label: IFRS 9 — Instruments financiers
    type: IFRS
    status: OBLIGATOIRE
  - id: isa-570
    label: ISA 570 (révisée) — Continuité d'exploitation
    type: ISA
    status: OBLIGATOIRE
    note: Incidence d'un bris de covenant sur l'appréciation de la continuité.

thresholds:
  - label: Bris de covenant et reclassement de la dette
    value: >
      Reclassement obligatoire en passif courant si un covenant est rompu à la clôture,
      sauf waiver obtenu avant la clôture (IAS 1)
    status: OBLIGATOIRE
    sourceIds: ["ias-1"]
  - label: ICR (Interest Coverage Ratio) — seuil d'alerte
    value: Alerte si ICR < 4x (paramètre interne PROBANT ; le seuil contractuel du covenant prévaut)
    status: PARAMETRABLE
    sourceIds: ["isa-520"]
    caveat: >
      Seuil d'alerte indicatif non opposable. Le seuil contractuel défini dans la
      convention de crédit prévaut toujours sur cette borne interne.
  - label: Current ratio — seuil d'alerte
    value: Alerte si current ratio < 1,2 (paramètre interne PROBANT ; le seuil contractuel prévaut)
    status: PARAMETRABLE
    sourceIds: ["isa-520"]
    caveat: >
      Seuil d'alerte indicatif non opposable. Le seuil contractuel défini dans la
      convention de crédit prévaut toujours sur cette borne interne.

materiality:
  globalMateriality:
    benchmark: Total bilan ou résultat avant impôt normalisé selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt normalisé
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Plutôt 60 % en cas de risque élevé ou d'anomalies historiques.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: ICR (Interest Coverage Ratio)
    formula: EBITDA (ou EBIT) / Charges d'intérêts nettes
    alertThreshold: Alerte si < 4x ; le seuil contractuel du covenant prévaut
    interpretation: Mesure la capacité à couvrir les charges d'intérêts ; un niveau faible signale un risque de défaut.
    status: PARAMETRABLE
    sourceIds: ["isa-520"]
  - name: Gearing (endettement net / capitaux propres)
    formula: Dette financière nette / Capitaux propres
    alertThreshold: Seuil contractuel du covenant ; sinon dégradation significative vs N-1
    interpretation: Apprécie le levier financier par rapport aux fonds propres.
    status: PARAMETRABLE
    sourceIds: ["isa-520"]
  - name: Leverage (dette nette / EBITDA)
    formula: (Dette financière - trésorerie et équivalents) / EBITDA
    alertThreshold: Seuil contractuel du covenant ; comparer à la limite définie au contrat
    interpretation: Indique le nombre d'années d'EBITDA nécessaires pour rembourser la dette nette.
    status: PARAMETRABLE
    sourceIds: ["isa-520"]
  - name: DSCR (Debt Service Coverage Ratio)
    formula: Flux de trésorerie disponible / Service de la dette (capital + intérêts)
    alertThreshold: Seuil contractuel du covenant ; alerte si < 1x
    interpretation: Mesure la capacité à honorer le service de la dette sur la période.
    status: PARAMETRABLE
    sourceIds: ["isa-520"]
  - name: Current ratio (liquidité générale)
    formula: Actif circulant / Passif courant
    alertThreshold: Alerte si < 1,2 ; le seuil contractuel du covenant prévaut
    interpretation: Apprécie la liquidité à court terme et la capacité à faire face aux échéances.
    status: PARAMETRABLE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Recalcul des ratios de covenants selon les définitions contractuelles
    objective: Vérifier le respect des covenants en utilisant les définitions exactes du contrat.
    method: Recalculer chaque ratio à partir des agrégats définis au contrat (et non des agrégats comptables standards).
    expectedVariation: Ratios conformes aux seuils contractuels avec une marge de sécurité.
    anomalyTrigger: Ratio franchissant le seuil contractuel, ou marge de sécurité très faible.
    benchmark: ["Seuils contractuels", "N-1", "Forecast"]
    assertions: ["Présentation", "Exactitude", "Évaluation"]
    sourceIds: ["isa-520", "isa-570"]
  - name: Analyse des hypothèses de prévisions (forecast)
    objective: Apprécier la robustesse du respect prospectif des covenants et de la continuité.
    method: Examiner les hypothèses de forecast (EBITDA, trésorerie, service de la dette) et tester leur sensibilité.
    expectedVariation: Hypothèses cohérentes avec l'historique et le plan d'affaires approuvé.
    anomalyTrigger: Hypothèses optimistes non étayées, bris de covenant projeté sur l'horizon de prévision.
    benchmark: ["Historique", "Plan d'affaires", "Seuils contractuels"]
    assertions: ["Évaluation", "Présentation"]
    sourceIds: ["isa-520", "isa-570"]

detailTests:
  - name: Recalcul des ratios selon les définitions contractuelles
    nature: Test substantif
    extent: Exhaustif sur l'ensemble des covenants en vigueur
    timing: Clôture
    samplingMethod: Exhaustif sur les covenants contractuels
    evidenceRequired:
      - Définitions contractuelles des ratios
      - Agrégats financiers retraités selon le contrat
      - Calcul des covenants à la clôture
    assertions: ["Exactitude", "Présentation", "Évaluation"]
    sourceIds: ["isa-500", "isa-520"]
  - name: Examen des waivers et lettres de renonciation
    nature: Inspection
    extent: Exhaustif sur les covenants franchis ou tendus
    timing: Clôture et événements postérieurs
    samplingMethod: Exhaustif sur les situations de bris ou de quasi-bris
    evidenceRequired:
      - Waivers obtenus auprès des prêteurs
      - Date d'obtention (avant ou après clôture)
      - Correspondance avec les banques
    assertions: ["Droits et obligations", "Présentation", "Rattachement"]
    sourceIds: ["isa-500", "isa-560"]
  - name: Correspondance avec les banques sur le respect des covenants
    nature: Confirmation externe
    extent: Exhaustif sur les prêteurs concernés
    timing: Clôture
    samplingMethod: Exhaustif sur les contreparties bancaires
    evidenceRequired:
      - Confirmations bancaires
      - Attestations de respect des covenants
      - Correspondance sur d'éventuels manquements
    assertions: ["Existence", "Droits et obligations", "Présentation"]
    sourceIds: ["isa-505", "isa-500"]
  - name: Contrôle des hypothèses de forecast et de la continuité
    nature: Test de détail
    extent: Hypothèses clés du forecast de respect des covenants
    timing: Clôture et date du rapport
    samplingMethod: Sélection ciblée sur les hypothèses sensibles
    evidenceRequired:
      - Prévisions de trésorerie et d'exploitation
      - Tests de sensibilité sur les covenants
      - Documentation de l'appréciation de la continuité
    assertions: ["Évaluation", "Présentation"]
    sourceIds: ["isa-570", "isa-520", "isa-500"]

risks:
  - name: Bris de covenant
    category: RISQUE_CONTROLE
    description: >
      Non-respect d'une clause financière à la clôture, exposant l'entité à l'exigibilité
      anticipée de la dette si aucun waiver n'est obtenu.
    indicators:
      - Ratios proches ou au-delà des seuils contractuels
      - Absence de calcul formalisé des covenants
      - Dégradation de l'EBITDA ou de la trésorerie
    response:
      - Recalculer les covenants selon les définitions contractuelles
      - Vérifier l'obtention de waivers avant la clôture
      - Apprécier l'incidence sur la classification et la continuité
    sourceIds: ["isa-315", "isa-330", "isa-505"]
  - name: Reclassement de la dette en courant
    category: RISQUE_INHERENT
    description: >
      Dette à long terme devenue exigible (ou reclassable) à la suite d'un bris de covenant
      non régularisé avant la clôture, faussant la présentation de la liquidité.
    indicators:
      - Covenant rompu à la clôture sans waiver préalable
      - Part non courante maintenue malgré l'exigibilité
      - Incohérence entre échéancier et présentation
    response:
      - Vérifier la date d'obtention des waivers (avant clôture)
      - Contrôler le reclassement en passif courant le cas échéant
      - Apprécier la présentation au regard d'IAS 1
    sourceIds: ["isa-315", "isa-330"]
  - name: Incertitude sur la continuité d'exploitation
    category: RISQUE_INHERENT
    description: >
      Le bris de covenant ou la tension sur la liquidité peut révéler une incertitude
      significative sur la capacité de l'entité à poursuivre son exploitation.
    indicators:
      - Bris de covenant non régularisé
      - Forecast projetant de nouveaux franchissements
      - Tension de trésorerie et refinancement incertain
    response:
      - Examiner les prévisions et leurs hypothèses
      - Apprécier les plans de refinancement et waivers
      - Conclure sur l'existence d'une incertitude significative (ISA 570)
    sourceIds: ["isa-570", "isa-315", "isa-330"]

ifrsVsPcg:
  - topic: Reclassement de la dette en cas de bris de covenant
    ifrsTreatment: >
      IAS 1 impose le reclassement en passif courant lorsqu'un covenant est rompu à la
      clôture, sauf si un waiver d'au moins douze mois est obtenu avant la clôture.
    pcgTreatment: >
      Le PCG ventile la dette selon son échéance et l'exigibilité ; l'incidence d'un bris de
      covenant s'apprécie au regard des règles françaises et de l'information en annexe.
    auditImpact: Vérifier la date d'obtention des waivers et la classification courant / non courant de la dette.
    sourceIds: ["ias-1", "pcg"]
  - topic: Informations sur le risque de liquidité
    ifrsTreatment: IFRS 7 impose des informations sur le risque de liquidité, les échéances et les clauses contractuelles.
    pcgTreatment: Informations en annexe sur les dettes et engagements selon les règles du PCG.
    auditImpact: Contrôler l'exhaustivité des informations sur les covenants et le risque de liquidité.
    sourceIds: ["ifrs-7", "pcg"]

