keyPoints:
  - Recalculer chaque covenant selon les définitions exactes du contrat (agrégats retraités).
  - Le seuil contractuel prévaut toujours sur les bornes d'alerte internes (ICR < 4x, current ratio < 1,2).
  - Vérifier la date d'obtention des waivers (avant clôture) pour la classification de la dette.
  - Apprécier l'incidence d'un bris de covenant sur la continuité d'exploitation (ISA 570).
  - PROBANT recalcule les ratios et signale les franchissements de seuils (silo dettes-financieres).

