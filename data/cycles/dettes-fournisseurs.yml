slug: dettes-fournisseurs
family: PASSIF_ENGAGEMENTS
title: Dettes fournisseurs
summary: >
  Cycle relatif aux dettes fournisseurs et comptes rattachés : exhaustivité du
  passif, séparation des exercices (cut-off des achats), factures non parvenues
  (FNP), avoirs à recevoir, litiges fournisseurs et recherche de passifs non
  enregistrés.

pcgAccounts: ["401", "403", "408"]
probantSiloIds: ["dettes-fournisseurs"]
probantCloisons: ["bilan-passif"]

applicableStandards:
  - id: pcg-cpt-408-486
    label: PCG comptes 408 / 4081 — Fournisseurs, factures non parvenues
    type: PCG
    status: OBLIGATOIRE
    note: Rattachement des charges fournisseurs à l'exercice (FNP / cut-off achats).
  - id: isa-505
    label: ISA 505 — Confirmations externes
    type: ISA
    status: OBLIGATOIRE
    note: Circularisation des fournisseurs.
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-520
    label: ISA 520 — Procédures analytiques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-330
    label: ISA 330 — Réponses aux risques évalués
    type: ISA
    status: OBLIGATOIRE

thresholds:
  - label: Rattachement des charges (cut-off achats)
    value: Comptabilisation des FNP pour les biens et services reçus non encore facturés à la clôture
    status: OBLIGATOIRE
    sourceIds: ["pcg-cpt-408-486"]
  - label: Écart de circularisation à investiguer
    value: Tout écart entre la réponse fournisseur et le solde comptable doit être rapproché et justifié
    status: PARAMETRABLE
    sourceIds: ["isa-505"]
    caveat: Seuil d'investigation interne PROBANT, à adapter au mandat ; non opposable.

materiality:
  globalMateriality:
    benchmark: Total bilan, total des achats ou résultat avant impôt selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au poids des achats
      dans l'activité.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Plutôt 60 % en cas de risque élevé sur l'exhaustivité du passif.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: DPO — Délai de paiement fournisseurs
    formula: (Dettes fournisseurs TTC / Achats TTC) × 360
    alertThreshold: Variation significative vs N-1 ou dépassement des délais légaux à investiguer
    interpretation: >
      Mesure le délai moyen de règlement ; une baisse brutale en fin d'exercice peut
      signaler des paiements anticipés ou un cut-off de charges incomplet.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Dettes fournisseurs / Achats
    formula: Dettes fournisseurs / Achats de l'exercice
    alertThreshold: Variation significative vs N-1 sans évolution d'activité correspondante
    interpretation: Détecte une incohérence entre le passif fournisseurs et le volume d'achats.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: FNP / Achats
    formula: Factures non parvenues / Achats de l'exercice
    alertThreshold: Ratio anormalement faible ou en baisse vs N-1 à investiguer
    interpretation: Apprécie la qualité du cut-off ; un ratio faible peut révéler une sous-estimation du passif.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520", "pcg-cpt-408-486"]
  - name: Fournisseurs débiteurs
    formula: Soldes fournisseurs débiteurs / Total dettes fournisseurs
    alertThreshold: Soldes débiteurs significatifs à reclasser et justifier
    interpretation: Identifie des avances, avoirs ou erreurs d'imputation nécessitant un reclassement à l'actif.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Revue analytique du poste fournisseurs et du DPO
    objective: Identifier une sous-estimation du passif ou une rupture de tendance du délai de paiement.
    method: Comparer le DPO et le ratio fournisseurs/achats N/N-1 et au secteur, analyser les soldes débiteurs.
    expectedVariation: Délai stable, cohérent avec les conditions de règlement contractuelles.
    anomalyTrigger: Chute du DPO en clôture, ratio fournisseurs/achats incohérent, soldes débiteurs significatifs.
    benchmark: ["N-1", "Secteur"]
    assertions: ["Exhaustivité", "Évaluation"]
    sourceIds: ["isa-520"]
  - name: Analyse du cut-off des achats autour de la clôture
    objective: S'assurer du rattachement des charges au bon exercice (FNP et avoirs à recevoir).
    method: Examiner les réceptions et factures de part et d'autre de la clôture et rapprocher des FNP.
    expectedVariation: Toutes les réceptions antérieures à la clôture sont rattachées à l'exercice.
    anomalyTrigger: Réception avant clôture facturée et comptabilisée en N+1 sans FNP.
    benchmark: ["Journal des réceptions", "Journal des achats"]
    assertions: ["Rattachement", "Exhaustivité"]
    sourceIds: ["isa-520", "pcg-cpt-408-486"]

detailTests:
  - name: Circularisation des fournisseurs
    nature: Confirmation externe
    extent: Fournisseurs significatifs et sélection sur les comptes à faible solde mais fort volume
    timing: Clôture
    samplingMethod: Sélection ciblée (montant et volume) + échantillonnage selon ISA 530
    evidenceRequired:
      - Réponses des fournisseurs
      - Rapprochement des écarts (factures en transit, paiements en cours)
      - Relevés de comptes fournisseurs
    assertions: ["Exhaustivité", "Exactitude", "Droits et obligations"]
    sourceIds: ["isa-505", "isa-500"]
  - name: Recherche de passifs non enregistrés
    nature: Test substantif
    extent: Décaissements et factures reçues postérieurs à la clôture
    timing: Post-clôture
    samplingMethod: Sélection ciblée sur les paiements et factures significatifs après clôture
    evidenceRequired:
      - Relevés bancaires post-clôture
      - Factures reçues après la clôture
      - Bons de réception rattachés à l'exercice
    assertions: ["Exhaustivité", "Rattachement"]
    sourceIds: ["isa-500", "isa-330"]
  - name: Test de cut-off réception / facture
    nature: Test de détail
    extent: Réceptions et factures autour de la date de clôture
    timing: Clôture
    samplingMethod: Sélection ciblée de part et d'autre de la clôture
    evidenceRequired:
      - Bons de réception
      - Factures fournisseurs
      - Calcul et justification des FNP / avoirs à recevoir
    assertions: ["Rattachement", "Exhaustivité"]
    sourceIds: ["isa-500", "pcg-cpt-408-486"]

risks:
  - name: Sous-estimation du passif / passifs non enregistrés
    category: RISQUE_INHERENT
    description: >
      Dettes fournisseurs ou FNP omises conduisant à une sous-évaluation du passif et
      une majoration du résultat.
    indicators:
      - DPO en baisse anormale en clôture
      - FNP faibles au regard de l'activité
      - Factures reçues après clôture non rattachées
    response:
      - Rechercher les passifs non enregistrés (décaissements et factures post-clôture)
      - Circulariser les fournisseurs et analyser le cut-off
    sourceIds: ["isa-500", "isa-505"]
  - name: Cut-off réception / facture défaillant
    category: RISQUE_CONTROLE
    description: Défaut de contrôle du rattachement entre réception des biens/services et enregistrement de la charge.
    indicators:
      - Absence de procédure de rapprochement réception / facture
      - FNP non calculées ou forfaitaires
    response:
      - Tester le contrôle de rapprochement bon de réception / facture
      - Recalculer les FNP et avoirs à recevoir
    sourceIds: ["isa-315", "isa-330"]
  - name: Fournisseur fictif
    category: RISQUE_FRAUDE
    description: Création d'un fournisseur fictif ou détournement via de fausses factures.
    indicators:
      - Fournisseur sans coordonnées vérifiables ou créé récemment
      - Paiements vers un compte bancaire atypique
      - Factures sans bon de réception correspondant
    response:
      - Vérifier l'existence réelle du fournisseur et la réalité de la prestation
      - Rapprocher factures, bons de commande et bons de réception
    sourceIds: ["isa-240", "isa-330"]

ifrsVsPcg:
  - topic: Comptabilisation et évaluation des dettes fournisseurs
    ifrsTreatment: >
      Les dettes fournisseurs sont comptabilisées au coût (passif financier au coût
      amorti, l'actualisation étant non significative pour les dettes à court terme) ;
      traitement convergent avec le PCG.
    pcgTreatment: >
      Comptabilisation au coût (montant à payer) ; la spécificité française porte sur
      les délais de paiement réglementés (Code de commerce / LME) et l'information
      associée en annexe plutôt que sur l'évaluation.
    auditImpact: >
      Peu de divergence d'évaluation ; concentrer les travaux sur l'exhaustivité, le
      cut-off et, en France, le respect et l'information sur les délais de paiement
      réglementés.
    sourceIds: ["pcg-cpt-408-486", "legifrance-code-commerce"]

