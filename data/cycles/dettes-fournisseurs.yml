keyPoints:
  - Privilégier la recherche de passifs non enregistrés (décaissements et factures post-clôture) pour l'exhaustivité.
  - Circulariser les fournisseurs significatifs et rapprocher les écarts (factures et paiements en transit).
  - Tester le cut-off réception / facture et recalculer les factures non parvenues (FNP).
  - Analyser les soldes fournisseurs débiteurs à reclasser et le DPO pour détecter une sous-estimation.
  - En France, vérifier le respect des délais de paiement réglementés et l'information associée en annexe.

