keyPoints:
  - Adresser des confirmations bancaires exhaustives pour sécuriser l'exhaustivité de la dette.
  - Recouper systématiquement les charges d'intérêts avec les encours pour détecter une dette omise.
  - Vérifier la ventilation courant / non courant à partir de l'échéancier contractuel.
  - Recalculer les covenants selon les définitions contractuelles et vérifier les waivers.
  - PROBANT suit l'endettement et signale les incohérences intérêts / encours (silo dettes-financieres).

