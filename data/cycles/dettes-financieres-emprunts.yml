slug: dettes-financieres-emprunts
family: CAPITAUX_PROPRES_FINANCEMENT
title: Dettes financières et emprunts
summary: >
  Cycle relatif aux dettes financières et emprunts : emprunts auprès des établissements
  de crédit, emprunts obligataires, comptes courants d'associés et concours bancaires
  courants. Couvre l'exhaustivité de la dette, la classification courant/non courant,
  les intérêts courus et le suivi des covenants.

pcgAccounts: ["16", "17", "519"]
probantSiloIds: ["dettes-financieres"]
probantCloisons: ["bilan-passif"]

applicableStandards:
  - id: ifrs-9
    label: IFRS 9 — Instruments financiers
    type: IFRS
    status: OBLIGATOIRE
    note: Applicable aux entités en référentiel IFRS ; évaluation au coût amorti.
  - id: ias-32
    label: IAS 32 — Instruments financiers, présentation
    type: IAS
    status: OBLIGATOIRE
    note: Classification dettes / capitaux propres.
  - id: pcg
    label: PCG — Emprunts et dettes assimilées (classe 1)
    type: PCG
    status: OBLIGATOIRE
  - id: isa-505
    label: ISA 505 — Confirmations externes
    type: ISA
    status: OBLIGATOIRE
    note: Confirmations bancaires des soldes et conditions d'emprunt.
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE

thresholds:
  - label: Classification courant / non courant
    value: >
      Ventilation obligatoire de la dette selon son échéance (part à moins d'un an / à plus d'un an)
    status: OBLIGATOIRE
    sourceIds: ["ias-32", "pcg"]
  - label: Comptabilisation des intérêts courus
    value: Rattachement obligatoire à l'exercice des intérêts courus non échus à la clôture
    status: OBLIGATOIRE
    sourceIds: ["pcg", "ias-32"]
  - label: Écart de coût moyen de la dette vs N-1
    value: Variation significative du coût moyen de la dette (paramètre interne PROBANT, à adapter au mandat)
    status: PARAMETRABLE
    sourceIds: ["pcg"]
    caveat: Seuil indicatif interne, non opposable.

materiality:
  globalMateriality:
    benchmark: Total bilan ou résultat avant impôt normalisé selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt normalisé
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Plutôt 60 % en cas de risque élevé ou d'anomalies historiques.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Dette nette / EBITDA (leverage)
    formula: (Dettes financières - trésorerie et équivalents) / EBITDA
    alertThreshold: Ratio élevé ou en forte hausse ; comparer au covenant contractuel
    interpretation: Mesure la capacité de remboursement ; un niveau élevé signale un risque de levier excessif.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Gearing (endettement net / capitaux propres)
    formula: Dette financière nette / Capitaux propres
    alertThreshold: Ratio élevé ou en dégradation ; le seuil contractuel du covenant prévaut
    interpretation: Indique le poids de l'endettement par rapport aux fonds propres.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Dette / Capitaux propres
    formula: Total des dettes financières / Capitaux propres
    alertThreshold: Variation significative vs N-1 à investiguer
    interpretation: Apprécie la structure de financement et l'autonomie financière.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Coût moyen de la dette
    formula: Charges d'intérêts de l'exercice / Encours moyen de dette financière
    alertThreshold: Variation significative vs N-1 ou vs taux contractuels
    interpretation: Détecte une dette omise (intérêts sans dette comptabilisée) ou une erreur de rattachement.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Analyse de variation de l'endettement
    objective: Identifier les nouveaux emprunts, remboursements et reclassements inhabituels.
    method: Comparer N/N-1 le tableau d'endettement, l'échéancier et la balance générale.
    expectedVariation: Variation cohérente avec les tableaux d'amortissement et les nouveaux financements.
    anomalyTrigger: Nouvel emprunt non documenté, remboursement incohérent, dette présente en N-1 disparue sans justification.
    benchmark: ["N-1", "Tableau d'amortissement", "Échéancier"]
    assertions: ["Existence", "Exhaustivité", "Évaluation"]
    sourceIds: ["isa-520", "nep-520"]
  - name: Test de cohérence intérêts / encours de dette
    objective: Détecter une dette omise ou un mauvais rattachement des charges d'intérêts.
    method: Recalculer un coût moyen implicite (charges d'intérêts / encours moyen) et le comparer aux taux contractuels.
    expectedVariation: Coût implicite proche des taux des contrats de prêt.
    anomalyTrigger: Charges d'intérêts sans dette correspondante, ou taux implicite anormal.
    benchmark: ["N-1", "Taux contractuels"]
    assertions: ["Exhaustivité", "Exactitude", "Rattachement"]
    sourceIds: ["isa-520"]

detailTests:
  - name: Confirmations bancaires
    nature: Confirmation externe
    extent: Exhaustif sur les établissements de crédit en relation
    timing: Clôture
    samplingMethod: Exhaustif sur les contreparties bancaires
    evidenceRequired:
      - Réponses aux demandes de confirmation bancaire
      - Liste des comptes et emprunts ouverts
      - Conditions d'emprunt confirmées (taux, échéance, garanties, covenants)
    assertions: ["Existence", "Exhaustivité", "Droits et obligations"]
    sourceIds: ["isa-505", "isa-500"]
  - name: Examen des contrats de prêt
    nature: Inspection
    extent: Exhaustif sur les emprunts significatifs
    timing: Clôture ou intérim
    samplingMethod: Sélection ciblée sur les emprunts significatifs
    evidenceRequired:
      - Contrats de prêt
      - Clauses de covenants et de défaut
      - Garanties et sûretés
    assertions: ["Droits et obligations", "Présentation", "Exactitude"]
    sourceIds: ["isa-500", "isa-505"]
  - name: Vérification des tableaux d'amortissement
    nature: Test de détail
    extent: Emprunts significatifs + échantillon sur le solde restant
    timing: Clôture
    samplingMethod: Sélection ciblée + échantillonnage selon ISA 530
    evidenceRequired:
      - Tableaux d'amortissement
      - Échéancier de la dette
      - Rapprochement avec la balance générale
    assertions: ["Exactitude", "Évaluation", "Présentation"]
    sourceIds: ["isa-500", "isa-530"]
  - name: Recalcul des intérêts courus
    nature: Test substantif
    extent: Exhaustif sur les emprunts en cours à la clôture
    timing: Clôture
    samplingMethod: Recalcul sur les emprunts significatifs
    evidenceRequired:
      - Tableaux d'amortissement
      - Taux et dates de paiement contractuels
      - Calcul des intérêts courus non échus
    assertions: ["Exactitude", "Rattachement", "Évaluation"]
    sourceIds: ["isa-500", "isa-520"]
  - name: Suivi des covenants
    nature: Test de détail
    extent: Exhaustif sur les emprunts assortis de covenants
    timing: Clôture
    samplingMethod: Exhaustif sur les contrats avec clauses financières
    evidenceRequired:
      - Définitions contractuelles des ratios
      - Calcul des covenants à la clôture
      - Attestations de respect ou waivers
    assertions: ["Présentation", "Droits et obligations", "Évaluation"]
    sourceIds: ["isa-500", "isa-505"]

risks:
  - name: Dette omise
    category: RISQUE_INHERENT
    description: >
      Emprunts ou concours non comptabilisés (financements hors bilan, comptes courants,
      lignes de crédit non enregistrées) conduisant à une sous-évaluation du passif.
    indicators:
      - Charges d'intérêts sans dette correspondante
      - Nouvel établissement bancaire non confirmé
      - Écart entre l'échéancier et la balance
    response:
      - Adresser des confirmations bancaires exhaustives
      - Recouper les charges d'intérêts avec les encours
      - Examiner les PV et la documentation de financement
    sourceIds: ["isa-505", "isa-500", "isa-330"]
  - name: Bris de covenant non identifié
    category: RISQUE_CONTROLE
    description: >
      Non-respect d'une clause financière à la clôture non détecté, entraînant un risque de
      reclassement de la dette et une incidence potentielle sur la continuité.
    indicators:
      - Dégradation des ratios proches des seuils contractuels
      - Absence de calcul formalisé des covenants
      - Waiver non obtenu ou obtenu tardivement
    response:
      - Recalculer les covenants selon les définitions contractuelles
      - Vérifier l'obtention de waivers avant la clôture
      - Apprécier l'incidence sur la classification et la continuité
    sourceIds: ["isa-315", "isa-330", "isa-505"]
  - name: Mauvaise classification courant / non courant
    category: RISQUE_CONTROLE
    description: >
      Erreur de ventilation de la dette entre part courante et non courante, faussant la
      présentation de la liquidité.
    indicators:
      - Échéancier incohérent avec la balance
      - Part à moins d'un an non isolée
      - Reclassement non opéré après bris de covenant
    response:
      - Rapprocher la ventilation de l'échéancier contractuel
      - Vérifier l'isolement de la part à moins d'un an
      - Contrôler les reclassements liés aux covenants
    sourceIds: ["isa-315", "isa-330"]

ifrsVsPcg:
  - topic: Évaluation des emprunts (coût amorti vs nominal)
    ifrsTreatment: >
      IFRS 9 impose l'évaluation au coût amorti selon la méthode du taux d'intérêt effectif,
      intégrant les frais d'émission et primes dans le calcul du rendement actuariel.
    pcgTreatment: >
      Le PCG retient la valeur nominale de la dette, avec étalement séparé des frais d'émission
      des emprunts sur la durée de l'emprunt.
    auditImpact: Vérifier le calcul du taux d'intérêt effectif (IFRS) ou l'étalement des frais d'émission (PCG) et la cohérence du rattachement.
    sourceIds: ["ifrs-9", "pcg"]
  - topic: Classification dettes / capitaux propres
    ifrsTreatment: IAS 32 classe l'instrument selon sa substance (obligation contractuelle de remise de trésorerie = dette).
    pcgTreatment: Classification selon la nature juridique de l'instrument dans le cadre du PCG.
    auditImpact: Apprécier la qualification des instruments hybrides et des comptes courants d'associés.
    sourceIds: ["ias-32", "pcg"]

