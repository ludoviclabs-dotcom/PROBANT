    type: ISA
    url: https://www.iaasb.org/publications/2009-handbook-international-standards-auditing-and-quality-control
    status: OBLIGATOIRE

keyPoints:
  - Recalculer intégralement le tableau et rapprocher la variation nette de la trésorerie au bilan N/N-1.
  - Analyser la classification des flux entre exploitation, investissement et financement (risque de fraude).
  - Neutraliser et justifier les éléments non cash inclus dans les flux.
  - Rapprocher les flux de financement de la variation des dettes financières.
  - PROBANT signale automatiquement les incohérences de classification et les ruptures de cash conversion (silo flux).

relatedCycles:
  - disponibilites-banques
  - dettes-financieres-emprunts
  - capitaux-propres

reviewStatus: REVIEW_REQUIRED
