slug: charges-produits-financiers
family: COMPTE_RESULTAT
title: Charges et produits financiers
summary: >
  Cycle relatif au résultat financier : intérêts sur emprunts et placements, écarts de
  change, dépréciations des actifs financiers et effets de juste valeur. Vérification du
  recalcul des intérêts, de l'exhaustivité des intérêts courus et du classement des éléments.

pcgAccounts: ["66", "76"]
probantSiloIds: []
probantCloisons: ["resultat"]

applicableStandards:
  - id: ifrs-9
    label: IFRS 9 — Instruments financiers
    type: IFRS
    status: OBLIGATOIRE
    note: Coût amorti, taux d'intérêt effectif et dépréciation des actifs financiers.
  - id: ias-32
    label: "IAS 32 — Instruments financiers : présentation"
    type: IAS
    status: OBLIGATOIRE
    note: Classement dettes / capitaux propres et présentation des éléments financiers.
  - id: pcg
    label: PCG — Charges et produits financiers (classes 66 et 76)
    type: PCG
    status: OBLIGATOIRE
  - id: isa-520
    label: ISA 520 — Procédures analytiques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE
  - id: isa-330
    label: ISA 330 — Réponses aux risques évalués
    type: ISA
    status: OBLIGATOIRE
  - id: isa-540
    label: ISA 540 (révisée) — Estimations comptables
    type: ISA
    status: OBLIGATOIRE
    note: Pertinent pour la juste valeur et les dépréciations financières.

thresholds:
  - label: Comptabilisation des intérêts courus
    value: Rattachement à l'exercice des intérêts courus non échus sur emprunts et placements
    status: OBLIGATOIRE
    sourceIds: ["pcg"]
  - label: Évaluation au coût amorti (référentiel IFRS)
    value: Comptabilisation des intérêts au taux d'intérêt effectif et dépréciation selon IFRS 9
    status: OBLIGATOIRE
    sourceIds: ["ifrs-9"]
  - label: Écart de coût moyen de la dette vs N-1
    value: Seuil d'alerte interne PROBANT, à adapter au mandat
    status: PARAMETRABLE
    sourceIds: ["isa-520"]

materiality:
  globalMateriality:
    benchmark: Résultat avant impôt normalisé
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 5 % à 10 % du résultat avant impôt normalisé
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au secteur et au risque.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Réduire en présence d'instruments dérivés ou d'évaluations à la juste valeur.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: Coût moyen de la dette
    formula: Charges d'intérêts / Encours moyen de dette financière
    alertThreshold: Écart significatif vs taux contractuels ou vs N-1
    interpretation: Détecte une omission d'intérêts courus ou une erreur de calcul des charges financières.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Charges financières / Dette moyenne
    formula: Total des charges financières (classe 66) / Encours moyen de dette financière
    alertThreshold: Variation atypique vs N-1 ou incohérence avec les contrats
    interpretation: Corrobore les charges financières avec le niveau d'endettement.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Résultat financier / Chiffre d'affaires
    formula: (Produits financiers - Charges financières) / Chiffre d'affaires
    alertThreshold: Variation inexpliquée vs N-1
    interpretation: Identifie un changement de structure financière ou un élément non récurrent.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]

analyticalProcedures:
  - name: Revue analytique du résultat financier
    objective: Corroborer charges et produits financiers avec l'endettement et la trésorerie.
    method: Comparer charges et produits financiers N/N-1 au regard des encours de dette et de placements.
    expectedVariation: Variation cohérente avec l'évolution de la dette, des taux et des placements.
    anomalyTrigger: Charges d'intérêts incohérentes avec l'encours, produits financiers atypiques.
    benchmark: ["N-1", "Encours de dette", "Taux contractuels"]
    assertions: ["Exhaustivité", "Exactitude", "Rattachement"]
    sourceIds: ["isa-520"]
  - name: Recalcul indépendant du coût moyen de la dette
    objective: Vérifier la cohérence d'ensemble des charges d'intérêts.
    method: Appliquer les taux contractuels aux encours moyens et comparer aux charges comptabilisées.
    expectedVariation: Charges proches du recalcul, écart résiduel justifiable.
    anomalyTrigger: Écart significatif entre charges comptabilisées et recalcul.
    benchmark: ["Taux contractuels", "Encours moyens"]
    assertions: ["Exactitude", "Exhaustivité"]
    sourceIds: ["isa-520", "isa-500"]

detailTests:
  - name: Recalcul des intérêts sur emprunts et placements
    nature: Test substantif
    extent: Emprunts et placements significatifs + échantillon sur le solde
    timing: Clôture
    samplingMethod: Sélection ciblée + échantillonnage selon ISA 530
    evidenceRequired:
      - Contrats d'emprunt et tableaux d'amortissement
      - Contrats de placement
      - Calcul des intérêts courus
    assertions: ["Exactitude", "Exhaustivité", "Rattachement"]
    sourceIds: ["isa-500", "isa-530"]
  - name: Test des écarts de change et de la trésorerie
    nature: Test de détail
    extent: Positions en devises et soldes financiers à la clôture
    timing: Clôture
    samplingMethod: Sélection ciblée sur les positions significatives en devises
    evidenceRequired:
      - Relevés bancaires
      - Cours de change de clôture
      - Calcul des écarts de change latents et réalisés
    assertions: ["Évaluation", "Exactitude", "Présentation"]
    sourceIds: ["isa-500", "isa-540"]
  - name: Test des produits financiers et des dépréciations d'actifs financiers
    nature: Test de détail
    extent: Produits financiers et dépréciations comptabilisés sur l'exercice
    timing: Clôture
    samplingMethod: Sélection ciblée sur les principaux produits et dépréciations
    evidenceRequired:
      - Avis d'opérés et relevés de placements
      - Justification des dépréciations financières
      - Contrats et conditions de rémunération
    assertions: ["Existence", "Évaluation", "Rattachement"]
    sourceIds: ["isa-500", "isa-540"]

risks:
  - name: Intérêts courus omis (exhaustivité)
    category: RISQUE_INHERENT
    description: Intérêts courus non échus non comptabilisés à la clôture, minorant les charges financières.
    indicators:
      - Charges d'intérêts incohérentes avec l'encours de dette
      - Absence d'intérêts courus sur emprunts en cours
    response:
      - Recalculer les intérêts courus
      - Rapprocher des contrats et tableaux d'amortissement
    sourceIds: ["isa-500", "isa-330"]
  - name: Classement incorrect des éléments financiers (défaillance du contrôle)
    category: RISQUE_CONTROLE
    description: Éléments financiers mal classés (financier / exploitation, charges / produits) faute de contrôle.
    indicators:
      - Reclassements manuels inhabituels en comptes 66 / 76
      - Absence de revue du classement des opérations financières
    response:
      - Tester les contrôles de classement des opérations financières
      - Examiner les écritures manuelles sur comptes 66 et 76
    sourceIds: ["isa-315", "isa-330", "ias-32"]
  - name: Instruments dérivés mal valorisés
    category: RISQUE_INHERENT
    description: Évaluation à la juste valeur des dérivés reposant sur des modèles et des données complexes.
    indicators:
      - Présence de dérivés ou de couvertures
      - Juste valeur fondée sur des données non observables
    response:
      - Examiner les contrats et les valorisations
      - Apprécier les modèles et hypothèses de juste valeur
    sourceIds: ["ifrs-9", "isa-540"]

ifrsVsPcg:
  - topic: Évaluation des charges et produits financiers
    ifrsTreatment: >
      Comptabilisation au coût amorti selon la méthode du taux d'intérêt effectif et dépréciation
      des actifs financiers selon le modèle des pertes attendues (IFRS 9) ; dérivés à la juste valeur.
    pcgTreatment: >
      Comptabilisation des intérêts sur une base nominale / contractuelle ; les frais d'émission
      peuvent être étalés et les dépréciations sont fondées sur des indices avérés (pas de pertes attendues).
    auditImpact: >
      Vérifier la méthode d'évaluation des intérêts (coût amorti vs nominal) et le traitement des
      dépréciations et des dérivés selon le référentiel applicable.
    sourceIds: ["ifrs-9", "pcg"]

