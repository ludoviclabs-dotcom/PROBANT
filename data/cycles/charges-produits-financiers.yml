keyPoints:
  - Recalculer les intérêts et vérifier l'exhaustivité des intérêts courus non échus.
  - Corroborer les charges financières avec l'encours de dette et les taux contractuels.
  - Apprécier les écarts de change, les dépréciations financières et la valorisation des dérivés.
  - En IFRS, vérifier l'application du taux d'intérêt effectif et du modèle de pertes attendues (IFRS 9).

