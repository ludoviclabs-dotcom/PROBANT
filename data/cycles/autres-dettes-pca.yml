    status: OBLIGATOIRE

keyPoints:
  - Rapprocher les produits constatés d'avance des contrats et de l'avancement des obligations de performance.
  - Recalculer le prorata temporis et tester la justification de l'apurement des PCA antérieurs.
  - Analyser le ratio PCA/CA et l'antériorité des soldes pour détecter une reconnaissance prématurée du revenu.
  - Rapprocher les autres dettes fiscales et sociales des déclarations et de la paie pour l'exhaustivité.
  - Sous IFRS 15, suivre le passif sur contrat par obligation de performance (granularité supérieure au PCG).

