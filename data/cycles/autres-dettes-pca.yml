slug: autres-dettes-pca
family: PASSIF_ENGAGEMENTS
title: Autres dettes et produits constatés d'avance
summary: >
  Cycle relatif aux autres dettes (fiscales, sociales et diverses) et aux produits
  constatés d'avance : exhaustivité des dettes, rattachement temporel des produits,
  identification des obligations de performance restant à satisfaire et
  justification de l'apurement des produits différés.

pcgAccounts: ["487", "42", "43"]
probantSiloIds: ["pca"]
probantCloisons: ["bilan-passif"]

applicableStandards:
  - id: pcg-cpt-486-487
    label: PCG comptes 486 / 487 — Charges et produits constatés d'avance
    type: PCG
    status: OBLIGATOIRE
    note: Rattachement temporel des produits constatés d'avance (487).
  - id: ias-1
    label: IAS 1 — Présentation des états financiers
    type: IAS
    status: OBLIGATOIRE
    note: Présentation des passifs (dettes, produits différés).
  - id: ifrs-15
    label: IFRS 15 — Produits des activités ordinaires tirés de contrats clients
    type: IFRS
    status: OBLIGATOIRE
    note: Passif sur contrat (contract liability) pour les produits différés.
  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    status: OBLIGATOIRE
  - id: isa-540
    label: ISA 540 (révisée) — Estimations comptables
    type: ISA
    status: OBLIGATOIRE
    note: Pertinent pour l'estimation des produits restant à différer.
  - id: isa-315
    label: ISA 315 (révisée) — Évaluation des risques
    type: ISA
    status: OBLIGATOIRE

thresholds:
  - label: Rattachement des produits (produits constatés d'avance)
    value: Différer la quote-part de produits facturés se rapportant à un exercice ultérieur
    status: OBLIGATOIRE
    sourceIds: ["pcg-cpt-486-487"]
  - label: Passif sur contrat (référentiel IFRS)
    value: Comptabilisation d'un passif sur contrat tant que les obligations de performance ne sont pas satisfaites
    status: OBLIGATOIRE
    sourceIds: ["ifrs-15"]

materiality:
  globalMateriality:
    benchmark: Chiffre d'affaires, total bilan ou résultat avant impôt selon le profil de l'entité
    formula: Appliquer la méthodologie globale de la mission ; pas de seuil officiel par cycle
    recommendedRange: 1 % à 2 % du total bilan, ou 5 % à 10 % du résultat avant impôt
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Les ISA/NEP imposent le principe et la documentation du jugement, mais ne
      fixent pas de pourcentage universel. Fourchette à adapter au modèle de revenus
      de l'entité.
  performanceMateriality:
    formula: 60 % à 75 % du seuil de signification global
    recommendedRange: 60 %-75 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-320", "nep-320"]
    caveat: >
      Le principe est imposé (ISA 320 / NEP 320) mais le pourcentage relève du jugement.
      Plutôt 60 % en cas de risque élevé sur la reconnaissance du revenu.
  clearlyTrivialThreshold:
    formula: 3 % à 5 % du seuil de signification global
    recommendedRange: 3 %-5 %
    status: BONNE_PRATIQUE
    sourceIds: ["isa-450", "nep-450"]
    caveat: Borne opérationnelle non fixée par les normes.

ratios:
  - name: PCA / Chiffre d'affaires
    formula: Produits constatés d'avance / Chiffre d'affaires
    alertThreshold: Ratio en forte baisse vs N-1 sans changement de modèle à investiguer
    interpretation: >
      Mesure la part de produits différés ; une baisse anormale peut signaler une
      reconnaissance prématurée du revenu.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Variation N / N-1 des PCA
    formula: (PCA N − PCA N-1) / PCA N-1
    alertThreshold: Variation significative non corrélée à l'activité à investiguer
    interpretation: Détecte une rupture de méthode d'étalement ou un défaut d'apurement.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-520"]
  - name: Antériorité des PCA
    formula: PCA dont l'apurement attendu est dépassé / Total PCA
    alertThreshold: PCA anciens non apurés à justifier
    interpretation: Identifie des produits différés sans objet ou un défaut de reprise en résultat.
    status: BONNE_PRATIQUE
    sourceIds: ["isa-540"]

analyticalProcedures:
  - name: Revue analytique des produits constatés d'avance
    objective: Apprécier la cohérence des PCA avec le modèle de revenus et le carnet de commandes.
    method: Comparer le ratio PCA/CA N/N-1, analyser la variation et l'antériorité des soldes.
    expectedVariation: Évolution cohérente avec les contrats pluriannuels et la facturation d'avance.
    anomalyTrigger: Baisse du ratio PCA/CA, PCA anciens non apurés, variation incohérente avec l'activité.
    benchmark: ["N-1"]
    assertions: ["Rattachement", "Exhaustivité"]
    sourceIds: ["isa-520", "isa-540"]
  - name: Revue des autres dettes fiscales et sociales
    objective: Vérifier l'exhaustivité et la cohérence des dettes fiscales et sociales.
    method: Rapprocher les soldes des déclarations (TVA, charges sociales, IS) et comparer à N-1.
    expectedVariation: Soldes cohérents avec les déclarations et l'évolution de la masse salariale / activité.
    anomalyTrigger: Solde sans déclaration correspondante, dette sociale incohérente avec la paie.
    benchmark: ["N-1", "Déclarations fiscales et sociales"]
    assertions: ["Exhaustivité", "Exactitude"]
    sourceIds: ["isa-520", "isa-500"]

detailTests:
  - name: Examen des contrats et factures à l'origine des PCA
    nature: Test de détail
    extent: Produits constatés d'avance significatifs
    timing: Clôture
    samplingMethod: Sélection ciblée sur les soldes significatifs
    evidenceRequired:
      - Contrats clients (durée, obligations de performance)
      - Factures émises d'avance
      - Échéancier de reconnaissance du produit
    assertions: ["Rattachement", "Évaluation"]
    sourceIds: ["isa-500", "ifrs-15"]
  - name: Recalcul du prorata temporis
    nature: Test substantif
    extent: PCA calculés au prorata d'une période
    timing: Clôture
    samplingMethod: Sélection ciblée + échantillonnage selon ISA 530
    evidenceRequired:
      - Bases de facturation et dates de prestation
      - Calcul de l'étalement (prorata temporis)
      - Justification de la quote-part différée
    assertions: ["Évaluation", "Rattachement"]
    sourceIds: ["isa-500", "pcg-cpt-486-487"]
  - name: Justification de l'apurement des PCA antérieurs
    nature: Test de détail
    extent: PCA de l'exercice précédent repris en résultat
    timing: Clôture
    samplingMethod: Sélection ciblée sur les soldes N-1 significatifs
    evidenceRequired:
      - Détail des PCA N-1
      - Justification de la reprise en produit en N
      - Suivi des produits restant à étaler
    assertions: ["Rattachement", "Exhaustivité"]
    sourceIds: ["isa-500", "pcg-cpt-486-487"]
  - name: Contrôle des autres dettes fiscales et sociales
    nature: Test de détail
    extent: Soldes significatifs des comptes 42 et 43
    timing: Clôture
    samplingMethod: Sélection ciblée + rapprochement aux déclarations
    evidenceRequired:
      - Déclarations sociales (DSN) et fiscales
      - Bulletins de paie et journaux de paie
      - Justificatifs de paiement post-clôture
    assertions: ["Exhaustivité", "Exactitude"]
    sourceIds: ["isa-500"]

risks:
  - name: Revenu reconnu prématurément
    category: RISQUE_FRAUDE
    description: >
      Produits différés repris trop tôt en résultat (PCA minorés) afin de majorer le
      chiffre d'affaires et le résultat de l'exercice.
    indicators:
      - Baisse du ratio PCA/CA sans changement de modèle
      - Apurement de PCA non justifié par la réalisation de la prestation
    response:
      - Rapprocher les PCA des contrats et de l'avancement des obligations de performance
      - Recalculer l'étalement et tester la justification de l'apurement
    sourceIds: ["isa-240", "ifrs-15"]
  - name: Dettes omises
    category: RISQUE_INHERENT
    description: Autres dettes fiscales, sociales ou diverses non comptabilisées conduisant à une sous-estimation du passif.
    indicators:
      - Dette sociale incohérente avec la masse salariale
      - Absence de provision pour congés payés ou charges à payer
    response:
      - Rapprocher les soldes des déclarations fiscales et sociales
      - Rechercher les charges à payer non enregistrées
    sourceIds: ["isa-500", "isa-315"]
  - name: PCA mal évalués
    category: RISQUE_CONTROLE
    description: Défaut de contrôle sur le calcul de l'étalement des produits différés.
    indicators:
      - Étalement forfaitaire sans base contractuelle
      - Absence de suivi des produits restant à étaler
    response:
      - Tester le contrôle de calcul des PCA
      - Recalculer le prorata temporis sur un échantillon
    sourceIds: ["isa-315", "isa-540"]

ifrsVsPcg:
  - topic: Produits différés — passif sur contrat vs produits constatés d'avance
    ifrsTreatment: >
      IFRS 15 impose la comptabilisation d'un passif sur contrat (contract liability)
      tant que l'entité n'a pas satisfait ses obligations de performance, avec un
      suivi par obligation de performance.
    pcgTreatment: >
      Le PCG utilise le compte de produits constatés d'avance (487) pour différer la
      quote-part de produits se rapportant à un exercice ultérieur ; convergence de
      principe sur le rattachement.
    auditImpact: >
      Convergence de principe ; la différence porte sur la granularité (obligations de
      performance distinctes sous IFRS 15) et le rythme de reconnaissance ; vérifier
      la cohérence de l'étalement avec l'avancement des prestations.
    sourceIds: ["ifrs-15", "pcg-cpt-486-487"]

