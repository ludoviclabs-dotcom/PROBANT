# Crosswalk contrôle ↔ source normative.
#
# Rend interrogeable, contrôle par contrôle, CE QUI LE FONDE. C'est la table
# qui permet de répondre à « au nom de quoi PROBANT affirme cela ? ».
#
# Les contrôles `basis: internal` apparaissent avec `relation: no_equivalent`
# et sans source : c'est un état LÉGITIME et explicite, pas un oubli. Un
# contrôle interne assume de n'être fondé sur aucun texte — c'est ce qui le
# distingue d'un contrôle opposable.
#
# Le contrôle K-001 vérifie la réciproque : aucun contrôle `hard_law` ne peut
# rester sans source primaire.

