# Crosswalk NEP ↔ ISA.
#
# UNE NEP N'EST PAS UNE ISA. Les NEP sont des normes françaises homologuées par
# arrêté ; les ISA sont des normes internationales. Certaines NEP constituent
# l'adaptation d'une ISA, d'autres s'en écartent ou n'ont pas d'équivalent.
# Ce crosswalk emploie donc `relation` pour porter la force du lien, et n'écrit
# `equivalent` que là où une source l'établit.
#
# Seul le lien NEP 230 ↔ ISA 230 a été vérifié (14/08/2026) : la NEP 230,
# homologuée par arrêté du 27/07/2023, est présentée comme l'adaptation de la
# norme ISA 230. Tous les autres liens reposent sur la concordance de
# numérotation — indice sérieux, PAS une preuve — et restent review_required.

kind: nep_isa
label: Crosswalk NEP ↔ ISA

links:
  - from: nep-230
    to: isa-230
    relation: partial
    status: verified
    note: >
      NEP 230 est l'adaptation française d'ISA 230. « partial » et non
      « equivalent » : une adaptation nationale peut ajouter ou retrancher des
      exigences, ce que la vérification n'a pas détaillé.
    sources:
      - sourceId: nep-cncc-master
        kind: primary
        url: https://doc.cncc.fr/docs/nep-230-documentati
        retrievedAt: "2026-08-14"

