# Crosswalk règle du moteur ↔ contrôle atomique FEC.
#
# Rattache les 15 règles de lib/rules-engine aux contrôles de
# data/fec/controls.yml, et rend visible l'écart entre la famille déclarée par
# une règle et le fondement établi pour le contrôle correspondant.
#
# ─── CONSTAT MAJEUR DE CE CROSSWALK ──────────────────────────────────────────
#
# Trois règles sont déclarées `family: "hardLaw"` (droit dur opposable) dans le
# moteur alors que la vérification de l'article A47 A-1 du 14/08/2026 n'a PAS
# établi qu'il les fonde :
#
#   R-HL-006  Conformité des numéros de compte (PCG)
#   R-HL-007  Ordre chronologique de validation
#   R-HL-008  Équilibre débit / crédit par écriture
#
# Ces exigences sont probablement fondées — mais ailleurs : dans le PCG et
# dans les règles de tenue de comptabilité, pas dans l'article qui décrit le
# format du fichier. Tant que le rattachement n'est pas fait, présenter ces
# constats comme opposables est un risque.
#
# CE PR NE MODIFIE PAS LE MOTEUR : changer la famille d'une règle changerait
# les résultats métier, ce que le lot s'interdit. L'écart est donc DOCUMENTÉ
# ici et repris dans docs/knowledge/REVIEW_REQUIRED.md, à l'attention de la
# revue métier puis d'un PR ultérieur.

kind: finding_control
