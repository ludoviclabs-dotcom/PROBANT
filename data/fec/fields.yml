# Référentiel des 18 zones du fichier des écritures comptables (FEC).
#
# Source primaire : article A47 A-1 du Livre des procédures fiscales,
# consulté sur Légifrance le 14/08/2026.
# https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000027804775
#
# Ce que la vérification a établi :
#   - les 18 zones, leur ORDRE et leur NOM exact (ligne d'en-tête) ;
#   - le format de date AAAAMMJJ, sans séparateur ;
#   - la substitution des zones 12 et 13 par « Montant » et « Sens » lorsque
#     le débit et le crédit ne figurent pas dans le système informatisé ;
#   - la convention de nommage du fichier : SirenFECAAAAMMJJ.
#
# Ce que la vérification n'a PAS établi : la tolérance au vide zone par zone.
# Elle est donc portée séparément par `allowedBlankStatus` et récapitulée dans
# docs/knowledge/REVIEW_REQUIRED.md.
#
# Ce référentiel décrit le FORMAT LÉGAL. Il ne duplique pas
# lib/canonical-model/fec.ts (modèle d'exécution) : la cohérence entre les deux
# est vérifiée par un test (lib/knowledge/__tests__/fec.test.ts).

