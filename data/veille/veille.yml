# Veille normative — Audit Normatif 360
#
# Ce fichier est la veille ARRÊTÉE : chaque évolution y est datée, sourcée et rattachée aux sources du
# registre (data/sources), aux fiches cycles (data/cycles) ou aux documents de méthode (data/methodology)
# qu'elle rend périmés. Il est lu par lib/audit-cycles/veille.ts, qui juge toutes les dates à `arreteAu`.
#
# Règles de saisie :
#  - une évolution « établie » porte l'adresse officielle réellement lue (`officialUrl`) et la date de lecture
#    (`readAt`) ; un fait repris d'une lecture déjà tracée dans le dépôt porte `access: repris_du_depot` et sa
#    `provenance` ; un fait que la source officielle ne laisse pas lire porte `access: inaccessible` ;
#  - `quote` : citation exacte et courte de la source officielle, ou null ;
#  - `integration` : a_integrer tant que le contenu PROBANT (registre, fiche, méthode) ne reflète pas
#    l'évolution ; integre une fois la correction faite et décrite dans `integrationNote` ;
#  - rattacher aux sources précises et aux cycles concernés, pas à une source générique (« pcg ») qui
#    exposerait à tort toutes les fiches.
# Relancer le relevé des liens : npm run normatif:liens (écrit data/veille/link-check.json).

arreteAu: '2026-11-09'
reverificationDays: 365
perimetre: 'Registre des sources d''Audit Normatif 360 (data/sources, 90 sources), six documents de méthodologie
  (data/methodology) et les références des 35 fiches cycles (data/cycles). Hors périmètre : le moteur de constat
  FEC et le registre de connaissances (lib/knowledge), dont les lectures datées sont réutilisées ici, pas refaites.

  '
methode: 'Relevé HTTP de toutes les adresses officielles du registre, puis lecture des pages officielles des émetteurs
  (IAASB, H2A, IASB, EUR-Lex, ANC, Légifrance, AFA) pour les textes cités. Les lectures officielles déjà tracées
  dans le dépôt (résolveur lib/knowledge/french-gaap.ts, registre lib/knowledge/registry.ts) sont reprises avec
  leur date. Une source secondaire peut orienter une recherche, jamais établir un fait. La veille ne réécrit aucune
  fiche : l''intégration d''une évolution reste une revue experte.

  '
