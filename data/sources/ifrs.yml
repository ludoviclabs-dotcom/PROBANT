# Normes comptables internationales IAS / IFRS — IFRS Foundation
# Source maîtresse : https://www.ifrs.org/issued-standards/list-of-standards/
# Application UE : règlement CE 1606/2002 (cf. eu.yml) après adoption EFRAG.
sources:
  - id: ifrs-standards-master
    label: IFRS Foundation — Liste des normes en vigueur
    type: IFRS
    url: https://www.ifrs.org/issued-standards/list-of-standards/
    status: OBLIGATOIRE
    summary: Recueil officiel des normes IAS/IFRS publiées par l'IFRS Foundation.

  - id: ias-1
    label: IAS 1 — Présentation des états financiers
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements.html
    status: OBLIGATOIRE

  - id: ias-2
    label: IAS 2 — Stocks
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories.html
    status: OBLIGATOIRE
    summary: Évaluation au plus faible du coût et de la valeur nette de réalisation.

  - id: ias-7
    label: IAS 7 — Tableau des flux de trésorerie
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows.html
    status: OBLIGATOIRE

  - id: ias-8
    label: IAS 8 — Méthodes comptables, changements d'estimations et erreurs
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-8-accounting-policies-changes-in-accounting-estimates-and-errors.html
    status: OBLIGATOIRE

  - id: ias-10
    label: IAS 10 — Événements postérieurs à la période de reporting
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-10-events-after-the-reporting-period.html
    status: OBLIGATOIRE

  - id: ias-12
    label: IAS 12 — Impôts sur le résultat
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-12-income-taxes.html
    status: OBLIGATOIRE
    summary: Impôts exigibles et différés.

  - id: ias-16
    label: IAS 16 — Immobilisations corporelles
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-16-property-plant-and-equipment.html
    status: OBLIGATOIRE
    summary: Approche par composants, durées d'utilité, modèle du coût ou de la réévaluation.

  - id: ias-19
    label: IAS 19 — Avantages du personnel
    type: IAS
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-19-employee-benefits.html
    status: OBLIGATOIRE
