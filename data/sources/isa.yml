# Normes internationales d'audit (ISA) — IAASB / IFAC
# Source maîtresse : https://www.iaasb.org/publications/international-standards-auditing-isa
# Les URLs individuelles pointent vers la page de référence IAASB ; le numéro de
# paragraphe précis reste à confirmer (A_VALIDER) lors de la revue experte.
sources:
  - id: isa-master
    label: International Standards on Auditing — IAASB
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: >
      Recueil des normes internationales d'audit publiées par l'IAASB.
      Référentiel d'audit appliqué à l'international et transposé en France via les NEP.

  - id: isa-200
    label: ISA 200 — Objectifs généraux de l'auditeur indépendant
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Objectifs généraux et conduite d'un audit selon les ISA, assurance raisonnable.

  - id: isa-240
    label: ISA 240 — Responsabilités de l'auditeur en matière de fraude
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: >
      Présomption de risque de fraude sur la reconnaissance du revenu et le
      contournement des contrôles par la direction (journal entries, estimations).

  - id: isa-250
    label: ISA 250 — Prise en compte des textes légaux et réglementaires
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Conformité aux lois et règlements ayant une incidence sur les comptes.

  - id: isa-300
    label: ISA 300 — Planification d'un audit d'états financiers
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Stratégie générale et plan de mission.

  - id: isa-315
    label: ISA 315 (révisée) — Identification et évaluation des risques d'anomalies significatives
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Connaissance de l'entité, du contrôle interne et évaluation des risques.

  - id: isa-320
    label: ISA 320 — Caractère significatif lors de la planification et de la réalisation d'un audit
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: >
      Impose le principe et la documentation du seuil de signification, sans fixer
      de pourcentage universel — les plages chiffrées relèvent du jugement professionnel.

  - id: isa-330
    label: ISA 330 — Réponses de l'auditeur aux risques évalués
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Procédures complémentaires (tests de contrôles, contrôles de substance).

  - id: isa-450
    label: ISA 450 — Évaluation des anomalies relevées au cours de l'audit
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Cumul, évaluation et communication des anomalies (individuelles et agrégées).

  - id: isa-500
    label: ISA 500 — Éléments probants
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Caractère suffisant et approprié des éléments probants collectés.

  - id: isa-501
    label: ISA 501 — Éléments probants — considérations spécifiques
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Stocks (inventaire physique), litiges, information sectorielle.

  - id: isa-505
    label: ISA 505 — Confirmations externes
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Procédures de demande de confirmation des tiers (banques, clients, avocats).

  - id: isa-520
    label: ISA 520 — Procédures analytiques
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Revue de cohérence des corrélations plausibles entre données financières.

  - id: isa-530
    label: ISA 530 — Sondages en audit
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: >
      Détermination de la taille d'échantillon selon le risque acceptable, la
      population, la matérialité et l'assurance recherchée.

  - id: isa-540
    label: ISA 540 (révisée) — Audit des estimations comptables
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Estimations, incertitude d'évaluation, biais de la direction.

  - id: isa-550
    label: ISA 550 — Parties liées
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Identification et audit des relations et transactions avec les parties liées.

  - id: isa-560
    label: ISA 560 — Événements postérieurs à la clôture
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Événements ajustants et non ajustants survenant après la date de clôture.

  - id: isa-570
    label: ISA 570 (révisée) — Continuité d'exploitation
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Appréciation de la continuité d'exploitation sur un horizon d'au moins 12 mois.

  - id: isa-580
    label: ISA 580 — Déclarations écrites
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Déclarations écrites de la direction comme éléments probants.

  - id: isa-620
    label: ISA 620 — Utilisation des travaux d'un expert désigné par l'auditeur
    type: ISA
    url: https://www.iaasb.org/publications/international-standards-auditing-isa
    status: OBLIGATOIRE
    summary: Recours à un expert (actuaire, évaluateur) et appréciation de ses travaux.
