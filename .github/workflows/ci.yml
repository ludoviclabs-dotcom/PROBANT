name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: probant
          POSTGRES_PASSWORD: probant_ci
          POSTGRES_DB: probant_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U probant -d probant_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://probant:probant_ci@localhost:5432/probant_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 : version utilisée localement (v24.14.0 au 13/08/2026) et
      # runtime par défaut de Vercel. `package.json` ne déclare aucun champ
      # `engines` — voir P2-3 dans CURRENT_STATE_MAP.md.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installation reproductible depuis le lockfile — échoue si
      # package.json et package-lock.json divergent.
      - name: Install (npm ci)
        run: npm ci

      - name: Migrations reproductibles
        run: |
          npm run db:check
          npm run db:generate
          git diff --exit-code -- drizzle
          npm run db:migrate

      - name: Lint (ESLint CLI)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      - name: Build (Next.js)
        run: npm run build

      # NON BLOQUANT — `xlsx@0.18.5` est supprimé par PR-03. Les alertes
      # transitives restantes exigent actuellement des mises à niveau majeures
      # de Next ou de l'outillage Drizzle et restent visibles pour PR-08.
      - name: Audit de sécurité (informatif, non bloquant)
        run: npm audit --audit-level=high || true
